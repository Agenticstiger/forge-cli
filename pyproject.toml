# pyproject.toml
[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-product-forge"
dynamic = ["version"]
description = "FLUID Build System: plan/apply/visualize data products across providers (GCP, Snowflake, Local) with policy & contract tests."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Agentics Transformation Pty Ltd" }]
keywords = ["data products", "FLUID", "odps", "odcs", "gitops", "gcp", "snowflake", "duckdb", "composer", "dbt", "dataform"]

# Optional but useful for PyPI/pipx users and internal catalogs
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Build Tools",
  "Topic :: System :: Systems Administration",
]

# Core runtime deps (keep lean; providers add heavy SDKs via extras)
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
  "jsonschema>=4.22",
  "rich>=13.7",
  "pydantic>=2.7",
  "typing-extensions>=4.8",
  "jinja2>=3.1.6",  # security: >=3.1.6 closes CVE-2025-27516 (sandbox escape via |attr)
  "httpx>=0.27",  # For FluidCommandCenter catalog provider
  "h11>=0.16",  # security: pin transitive h11 >=0.16 to close CVE-2025-43859 (chunked request smuggling)
  "requests>=2.32.5",  # For Data Mesh Manager catalog publishing and shared HTTP helpers
  # LiteLLM is the canonical LLM backend (was an opt-in extra). It
  # replaces ~1,300 lines of per-provider wire-format code with one
  # unified API across openai / anthropic / gemini / bedrock / azure /
  # vertex / groq / mistral / cohere / ollama / etc., plus built-in
  # cost tracking, retries, streaming, and tool-use normalisation.
  "litellm>=1.83.7,<2",  # security: >=1.83.7 closes CVE-2026-42208 (CVSS 9.3 SQLi); skips compromised 1.82.7/1.82.8 PyPI artifacts
  "python-dotenv>=1.0",  # .env file credential loading in fluid_build.credentials.dotenv_store
  "cryptography>=46.0.7",  # Fernet-encrypted credential store; security: >=46.0.7 closes CVE-2026-26007/39892/34073
  # OS keyring is now a hard dependency (Issue 5).  Catalog source
  # secrets default to the OS keyring (encrypted-at-rest); the
  # legacy plaintext YAML fallback is gated behind
  # FLUID_ALLOW_PLAINTEXT_SOURCE_SECRETS=1 *and* file chmod 600.
  # Making keyring core eliminates the "I added a source via the
  # wizard but resolution fails because keyring isn't installed"
  # first-time UX trap.
  "keyring>=24.0",
  # Layered settings (init args > env > .env > secrets-dir > defaults) for
  # the acquisition runner credential layer. Subsumes hand-rolled
  # setdefault_env precedence + per-platform alias machinery.
  # Borrowed-not-built per /borrow-before-build (skill receipts in commit msg):
  #   docs:  https://docs.pydantic.dev/latest/concepts/pydantic_settings/
  "pydantic-settings>=2.0",
  # Official Anthropic-maintained Model Context Protocol Python SDK.
  # Two consumers in this codebase:
  #   1. ``fluid mcp serve`` — FastMCP + ServerSession.create_message
  #      (canonical server-side sampling). Replaced ~450 LOC of
  #      hand-rolled MCP plumbing in the Phase 3 migration.
  #   2. ``fluid mcp output-port serve`` — the consumer-side gateway
  #      that turns a FLUID expose into an agent-consumable MCP
  #      endpoint and enforces ``policy.agentPolicy``
  #      (allowedModels/allowedUseCases) at every read.
  #
  # Floor pinned at 1.20:
  #   - 1.7's tools/base.py does ``issubclass(param.annotation, Context)``
  #     which raises TypeError under ``from __future__ import annotations``
  #     + ``ctx: Context = None``. Later 1.x releases use
  #     ``typing.get_type_hints()`` and handle the deferred-annotation +
  #     Optional shape correctly.
  #   - 1.15's ``ClientSession.__init__`` doesn't yet accept
  #     ``sampling_capabilities``; that landed in a later 1.x. Our live
  #     sampling integration test (test_mcp_live_llm_sampling.py) advertises
  #     the sampling capability via that kwarg so the floor must include it.
  #   - The gateway depends on the lifespan API + ``mcp.shared.memory``
  #     test fixtures introduced in 1.20.
  #   1.20+ has all of the above. Pinned by the mcp-sdk-drift CI job.
  # Ceiling ``<2.0`` gates any future major bump (tested against 1.27.x).
  #
  # Borrowed-not-built per /borrow-before-build (skill receipts in
  # AGENT_IDE.md "Related work" section + the gateway commit msg):
  #   docs:  https://modelcontextprotocol.github.io/python-sdk/
  #   repo:  https://github.com/modelcontextprotocol/python-sdk
  "mcp>=1.20,<2.0",
  # MCP output-port rate limiter — sliding-window + optional Redis fleet
  # backend. Borrowed-not-built per /borrow-before-build
  # (vutran1710/PyrateLimiter, MIT): its RedisBucket uses the same
  # sorted-set sliding window we'd otherwise hand-roll, and InMemoryBucket
  # covers the single-instance case. We wrap it with a fail-open →
  # in-process degrade on Redis outage (the one behaviour the lib leaves
  # to the caller).
  "pyrate-limiter>=3,<5",
  # Borrowed SQL parser (MIT) used by fluid_build.providers._sql_safety to
  # AST-classify statement bodies for the Snowflake action surfaces, so a
  # contract cannot smuggle account-level / multi-statement SQL through the
  # custom-SQL / task-body / view-body surfaces. Borrowed-not-built per
  # /borrow-before-build: https://github.com/tobymao/sqlglot
  "sqlglot>=25.0",
  # Bitol-vendor-listed Python library for ODCS v3.1.0. Provides typed
  # Pydantic v2 models + ``from_file()`` / ``to_yaml()`` for lossless
  # ODCS YAML I/O. Maintained by the ``datacontract`` org (same folks
  # who ship ``datacontract-cli``).
  #
  # Borrowed-not-built per /borrow-before-build:
  #   PyPI:    https://pypi.org/project/open-data-contract-standard/
  #   GitHub:  https://github.com/datacontract/open-data-contract-standard-python
  #   Listed:  https://github.com/bitol-io/open-data-contract-standard/blob/main/vendors.md
  #
  # Powers fluid_build.providers.odcs.io for ODCS file I/O. Mapper-based
  # FLUID ↔ ODCS conversion stays on plain dicts so the pass-through
  # buckets that preserve unmodeled fields keep their round-trip
  # fidelity contract.
  "open-data-contract-standard>=3.1.2",
  # Optional UX nicety on Windows; no-op elsewhere
  "colorama>=0.4.6; platform_system == 'Windows'",
]

[project.optional-dependencies]
# Provider SDK (install once published)
sdk = [
  "fluid-provider-sdk>=0.1.0",
]

# Stricter ODCS validation via vowl (MIT, GovTech Data Practice).
# Bitol vendor-listed validation engine that aggregates ALL violations
# (no first-error-only), runs format checks (uuid/email/ipv4/...),
# auto-derives SQL data checks from contract metadata, and can run
# them against real data sources via Ibis.
#
# Today we use vowl's *spec-parsing* side only — when this extra is
# installed and ``ODCS_VOWL_VALIDATE=true`` (or ``fluid odcs validate
# --vowl``), ``OdcsProvider.render`` runs a vowl second pass to catch
# semantic issues jsonschema doesn't surface (stricter format
# validation, unevaluated-properties enforcement, etc.).
#
# Borrowed-not-built per /borrow-before-build:
#   PyPI:    https://pypi.org/project/vowl/
#   GitHub:  https://github.com/govtech-data-practice/vowl
#   Listed:  https://github.com/bitol-io/open-data-contract-standard/blob/main/vendors.md
odcs-strict = [
  "vowl>=0.0.2",
]

# Local provider (DuckDB)
local = [
  "duckdb>=1.0",
  "pandas>=2.2",
]

# GCP provider (install only when needed)
gcp = [
  "google-auth>=2.29",
  "google-auth-oauthlib>=1.2",
  "google-cloud-bigquery>=3.20",
  "google-cloud-storage>=2.16",
  # V1.5 — Dataplex metadata source catalog. Optional within the
  # gcp extra so users wanting BigQuery alone don't pay for the
  # Dataplex SDK. Pulled in by default because most BigQuery
  # adopters also use Dataplex tagging.
  "google-cloud-dataplex>=1.0",
  # optional; gated for 3.10+ environments where wheel support exists
  "google-cloud-iam>=2.15 ; python_version >= '3.10'",
  # optional runtime helpers (dbt) — also 3.10+ where ecosystem is healthiest
  "dbt-bigquery>=1.7 ; python_version >= '3.10'",
]

# Snowflake provider
snowflake = [
  "snowflake-connector-python>=4.4",
  "dbt-snowflake>=1.7 ; python_version >= '3.10'",
]

# AWS provider (S3 / Glue / Athena). boto3 is lazy-imported by the
# provider; this extra is the explicit install target so `.[aws]` actually
# pulls the SDK — the integration workflows install `.[dev,aws]`.
aws = [
  "boto3>=1.34",
]

# Visualizations (plan graph, HTML)
viz = [
  "graphviz>=0.20",
]

# ODPS / OPDS export (spec conversion). Two distinct standards both
# abbreviated ODPS: Bitol Open Data Product Standard v1.0.0 and the LF/ODPI
# Open Data Product Specification v4.1. Both are covered by this extra.
odps = [
  "ruamel.yaml>=0.18",
]

# Back-compat alias — earlier docs / install scripts used ``[opds]`` for the
# letter-swap of ODPS. Kept as an empty alias that depends on ``[odps]`` so
# existing ``pip install "data-product-forge[opds]"`` invocations keep
# working through the rename.
opds = [
  "data-product-forge[odps]",
]

# Optional TUI extras
tui = [
  "textual>=0.58",
]

# Optional copilot discovery helpers for Parquet / Avro metadata inspection
copilot = [
  "pyarrow>=14",
  "fastavro>=1.9",
]


# Optional embedding-backed semantic search for the memory/semantic namespace.
# When this extra is installed AND the backing store is a SqliteBackend,
# ``VectorBackend`` upgrades from stdlib ``difflib`` ranking to a real
# vector index (via ``sqlite-vec``). Without the extra it silently
# falls back to the stdlib path — no crash, no import error.
vector = [
  "sqlite-vec>=0.1",
]

# Postgres-backed staged memory store.
postgres = [
  "psycopg[binary]>=3.1",
]

# SPIFFE/SPIRE workload-identity validation for the MCP output-port
# gateway (``FLUID_MCP_AUTH_MODE=spiffe``). Provides the canonical
# JwtSvid + JwtBundle types and ``parse_and_validate`` that
# enforce SPIFFE JWT-SVID semantics (audience, SPIFFE-ID structure,
# allowed-algorithm list per the SPIFFE standard) more strictly
# than open-coded PyJWT could.
#
# Borrowed-not-built per /borrow-before-build (retrospective audit
# 2026-05-14): adopting py-spiffe over the prior 30 LOC custom path
# trades ~25 MB of transitive deps (grpcio + protobuf, pulled by
# py-spiffe's Workload API client even when unused) for spec-
# faithful SVID validation. Optional extra so users not running in
# SPIFFE mode pay zero cost — only ``mode=spiffe`` triggers the
# import.
#   docs:  https://github.com/HewlettPackard/py-spiffe
spiffe = [
  "spiffe>=0.2.9",
]

# LiteLLM is now a core dependency (above), not an extra. The
# ``[litellm]`` alias is kept empty for back-compat with anyone who
# scripted ``pip install fluid-build[litellm]`` during the opt-in
# preview window.
litellm = []

# V1.5 metadata-source catalog adapters.
#
# Each ``[<name>]`` extra installs ONE catalog adapter's SDK. The
# umbrella ``[catalogs]`` extra installs all of them so a user
# wanting "every catalog" can do ``pip install
# "data-product-forge[catalogs]"`` once. Each adapter's import is
# lazy (inside the adapter's connection helper), so installing the
# extra without configuring the matching catalog causes zero
# runtime cost.

# Databricks Unity Catalog metadata reader.
databricks = [
  "databricks-sdk>=0.20",
]

# DataHub metadata reader.
datahub = [
  "acryl-datahub>=0.13",
]

# OS keyring for the V1.5 credential resolver.
#
# As of Issue 5, ``keyring`` is a HARD core dependency (declared in
# the top-level ``dependencies`` list above).  This empty extra is
# kept as a backwards-compatibility alias so existing
# ``pip install "data-product-forge[keyring]"`` invocations and
# ``data-product-forge[catalogs]`` (which references it) keep
# working without warnings.
keyring = []

# Umbrella: every metadata-source catalog adapter + the keyring
# integration. Gives users one ``pip install`` to wire up
# Snowflake / Unity / BigQuery+Dataplex / Glue / DataHub / DMM.
catalogs = [
  "data-product-forge[snowflake]",
  "data-product-forge[gcp]",  # bigquery + dataplex
  "data-product-forge[aws]",  # glue catalog via boto3
  "data-product-forge[databricks]",
  "data-product-forge[datahub]",
  "data-product-forge[keyring]",
]

# Docs toolchain (optional; if you’ll publish docs)
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
]

# Dev / QA
dev = [
  "pytest>=7.4",
  "pytest-cov>=4.1",
  "pytest-asyncio>=0.23",        # For async test support
  "pytest-randomly>=3.15",       # Randomize test order to catch hidden deps
  "respx>=0.21",                 # HTTPX request mocking — used by acquisition test matrix
  "hypothesis>=6.100",           # Property-based testing — used by tests/property/
  "deepdiff>=7.0",               # Structural diff — used by OdcsProvider.roundtrip_check
  "mypy>=1.10",
  "ruff>=0.5",
  "types-PyYAML>=6.0.12",
  "black==26.3.1",
  "requests>=2.32.5",
  # Architecture linter — declarative TOML contracts (under
  # ``[tool.importlinter]`` below) enforced by the ``lint-imports`` CLI.
  # Borrowed-not-built per /borrow-before-build (seddonym/import-linter,
  # BSD-2, used by Google langextract / MLRun / Open edX). Pins the
  # invariant that ``fluid_build.observability`` must not depend on
  # ``fluid_build.build_runners`` (the cycle root that previously broke
  # ``cli/__init__.py`` at import time) and that the tier-0
  # ``fluid_build._net`` leaf module stays free of fluid_build upstreams.
  "import-linter>=2.0",
  # SBOM generation — ``scripts/generate_sbom.py`` builds a CycloneDX
  # 1.5 document via the official model library rather than hand-emitting
  # JSON (borrow-before-build; CycloneDX/cyclonedx-python-lib, Apache-2.0).
  # Already present transitively via pip-audit/cyclonedx-bom; declared
  # explicitly because the script now imports it directly.
  "cyclonedx-python-lib>=8",
  "packageurl-python>=0.11",
]

# Light (in-process) integration-test emulators — Stage 1. moto mocks the
# AWS APIs in-process (and pulls boto3); fakesnow patches
# snowflake-connector-python over an embedded DuckDB. Installed by the
# ci.yml `emulated-integration` job so Stage-1 provider integration tests
# run on every PR — including from forks — with zero cloud credentials.
test-emulators = [
  # `server` pulls Flask so `ThreadedMotoServer` can back the OpenTofu
  # autogenerator e2e — `tofu`, a Go binary, needs a real HTTP endpoint
  # and cannot use moto's in-process `mock_aws`.
  "moto[glue,server]>=5",
  "fakesnow>=0.9",
]

# Heavy (Docker-based) integration-test emulators — Stage 2. These
# clients drive the GCP emulators (BigQuery / GCS / Pub/Sub) and
# LocalStack respectively, all via real HTTP endpoints.
#
# google-auth is pulled in transitively but listed explicitly so the
# iac-tests.yml Stage 2 install (which uses just this extra) gets
# ``AnonymousCredentials`` for the emulator clients without going
# through the heavier full ``[gcp]`` extra.
test-emulators-heavy = [
  "google-auth>=2.29",
  "google-cloud-bigquery>=3.20",
  "google-cloud-storage>=2.16",
  "google-cloud-pubsub>=2.38",
  "boto3>=1.34",
]

# One-shot install for contributors
all = [
  "data-product-forge[local,aws,gcp,snowflake,viz,odps,tui,copilot,vector,postgres,docs,dev]"
]

[project.scripts]
# Expose as a shell command (great with pipx)
fluid = "fluid_build.cli:main"

# Optional future plugin discovery (safe metadata; your code can adopt entrypoints later)
[project.entry-points."fluid_build.providers"]
local = "fluid_build.providers.local:LocalProvider"
aws = "fluid_build.providers.aws:AwsProvider"
gcp = "fluid_build.providers.gcp:GcpProvider"
snowflake = "fluid_build.providers.snowflake:SnowflakeProvider"
odps = "fluid_build.providers.odps:OdpsProvider"

[project.urls]
Homepage = "https://agenticstiger.github.io/forge_docs/"
Repository = "https://github.com/Agenticstiger/forge-cli"
Issues = "https://github.com/Agenticstiger/forge-cli/issues"
Documentation = "https://agenticstiger.github.io/forge_docs/"
Changelog = "https://github.com/Agenticstiger/forge-cli/blob/main/CHANGELOG.md"

[tool.setuptools_scm]
# Wheel/sdist version is derived from the git tag (e.g. v0.7.11a1 → 0.7.11a1).
# fallback_version is used when not in a git checkout (e.g. tarball install).
fallback_version = "0.0.0+unknown"
# PyPI rejects versions with a local segment like "0.7.10+g1234abc"; suppress.
local_scheme = "no-local-version"

[tool.setuptools]
package-dir = {"" = "."}
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["fluid_build*"]

# Ensure non-.py assets ship in wheels (schemas, templates, static HTML, etc.)
[tool.setuptools.package-data]
fluid_build = [
  # PEP 561 marker — tells consumers' type checkers (mypy, pyright) to
  # honour the inline type annotations in this package. Without this,
  # downstream code that imports ``fluid_build.engine`` sees the careful
  # ``Optional[Path]`` / ``ClassVar[str]`` / typed-result annotations as
  # ``Any`` regardless of how strict the consumer's mypy config is.
  "py.typed",
  "build-manifest.yaml",
  "features.yaml",
  # ``cli/llm_models.json`` is the provider/tier catalog that
  # ``forge_copilot_llm_providers`` loads at runtime; without this glob the
  # file silently drops from the wheel and any fresh ``pip install`` of the
  # published package falls back to the built-in defaults. Kept as a
  # file-level pattern (``cli/*.json``) — not ``cli/**/*.json`` — because
  # the ``cli/agent_specs`` and ``cli/industry_skills`` subtrees already
  # have their own YAML-only globs above and no other ``cli/**`` directory
  # should accidentally sweep in test fixtures.
  "cli/*.json",
  "cli/agent_specs/**/*.yaml",
  "cli/industry_skills/**/*.yaml",
  "copilot/**/*.yaml",
  "copilot/**/*.md",
  "schemas/**/*.json",
  "schemas/**/*.yaml",
  "templates/**/*",
  "assets/**/*",
  "static/**/*",
  "providers/**/templates/**/*",
  "providers/**/assets/**/*",
  "providers/**/*.json",
  "providers/**/*.yaml",
]
# Avoid shipping compiled junk, stale backups, and test fixtures.
#
# ``providers/**/test_*`` matches *directories* named ``test_*``; the
# explicit ``test_*.json`` / ``test_*.yaml`` file-prefix patterns below
# catch the common case of per-provider fixture files colocated with the
# shipped provider (e.g. ``providers/aws/test_fluid_0.7.1_contract.json``).
# Without those, the provider-data globs above would sweep the fixtures
# into the wheel, bloating it and leaking internal test artifacts.
[tool.setuptools.exclude-package-data]
"*" = ["*.pyc", "*.pyo", "*~", "*.bak", "*.old", "__pycache__/*"]
fluid_build = [
  "providers/**/test_*",
  "providers/**/test_*.json",
  "providers/**/test_*.yaml",
]

# ---- Tooling configs consolidated here ----

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# T201 (flake8-print) is enabled for ``fluid_build/`` so stray ``print``
# calls fail lint. User-facing output belongs in ``fluid_build.cli.console``
# (``cprint``/``success``/``warning``/``error``). Legitimate low-level
# sinks (the console module itself, the error printer, and plain-TTY
# fallbacks when Rich is unavailable) are allowed via per-file-ignores
# or a ``# noqa: T201`` comment that explains the exemption.
# See CODE_REVIEW C-011.
select = ["E", "F", "I", "B", "T201"]
ignore = [
  "E203",   # whitespace before ':' — Black-compatible
  "E501",   # line-too-long — handled by Black where possible
  "E701",   # multiple statements on one line (colon)
  "E702",   # multiple statements on one line (semicolon)
  "E402",   # module-level import not at top — needed for conditional imports
  "F401",   # unused import — many are re-exports
  "F841",   # unused variable — some used in tests for assertions
  "B904",   # raise-without-from — existing pattern in codebase
  "B007",   # unused loop variable — common in iteration patterns
  "B017",   # assert-raises-exception — existing test patterns
  "B023",   # function-uses-loop-variable — existing patterns
  "B027",   # empty-method-without-abstract-decorator — base class patterns
  "E712",   # true-false-comparison — existing patterns
  "E721",   # type-comparison — existing patterns
  "E741",   # ambiguous-variable-name — existing patterns
  "F402",   # import-shadowed-by-loop-var — existing patterns
  "F403",   # undefined-local-with-import-star — existing patterns
  "F811",   # redefined-while-unused — overload patterns
]

[tool.ruff.lint.per-file-ignores]
# Tests, doctor scripts, and one-shot tools are allowed bare print().
"tests/**" = ["T201"]
"scripts/**" = ["T201"]
# The console module owns print() fallbacks by design.
"fluid_build/cli/console.py" = ["T201"]
# Core imports a fallback ``Console.print`` shim when Rich is missing.
"fluid_build/cli/core.py" = ["T201"]
# The error printer is the last-resort path when the Rich panel render
# itself fails — it MUST use bare print(..., file=sys.stderr).
"fluid_build/cli/errors.py" = ["T201"]

[tool.bandit]
# B608: SQL query construction is expected — this is a pipeline/SQL code generator
# B324: MD5 used for checksums, not security
# B310: urlopen used for schema fetching with controlled URLs
skips = ["B608", "B324", "B310", "B113"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.10"
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --disable-warnings -m 'not live_llm and not live_judge'"
markers = [
    "unit: Unit tests (fast, no I/O)",
    "integration: Integration tests (may need network/files)",
    "slow: Tests that take significant time (>5s)",
    "smoke: Quick smoke tests for basic functionality",
    "aws: Tests requiring AWS credentials",
    "gcp: Tests requiring GCP credentials",
    "snowflake: Tests requiring Snowflake credentials",
    "provider: Tests for provider implementations",
    "datamesh: Tests for DataMesh Manager provider",
    "policy: Tests for policy validators",
    "runtime: Tests for runtime generators",
    "live_llm: Tests that call a real LLM (cost ~$0.0001/run; require an API key in env)",
    "live_judge: Opt-in tests that call the real JudgeAgent against an LLM (cost ~$0.001/run; require an API key in env)",
    "redteam: Deterministic adversarial tests for the agentic layer (zero-token, no LLM)",
    "emulated: Stage-1 keyless integration tests backed by in-process emulators (moto, fakesnow); run on every PR via ci.yml",
    "emulated_heavy: Stage-2 Docker-based emulated integration tests (bigquery-emulator, LocalStack); admin-gated via integration-emulated-heavy.yml",
    "live_postgres: Opt-in tests that require a real Postgres reachable on localhost:55432/tpch (see tests/fixtures/sandboxes/from-source-postgres/); skipped when the sandbox is unreachable",
]

[tool.coverage.run]
branch = true
source = ["fluid_build"]
omit = ["fluid_build/**/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# ── import-linter contracts ────────────────────────────────────────────
#
# Run locally:  ``.venv/bin/lint-imports``  (exit 0 = pass, 1 = violation)
#
# These contracts close the gap that surfaced when ``cli/__init__.py``
# import-time blew up with a cycle through ``observability →
# build_runners → cli``.  The structural fix landed (the canonical SSRF
# gate ``_hostname_is_private`` moved out of ``build_runners._alerter``
# into the tier-0 ``fluid_build._net`` leaf module), and these contracts
# stop the cycle from being re-introduced by a future drive-by edit.
[tool.importlinter]
root_package = "fluid_build"
# Skip cycle-graph construction for any module that fails to import
# under the linter's analysis venv (e.g. a provider whose heavy SDK
# isn't pinned in the dev extra). Contract violations still surface;
# only unrelated dependency import errors are tolerated.
include_external_packages = false

[[tool.importlinter.contracts]]
name = "observability must not depend on build_runners"
type = "forbidden"
source_modules = ["fluid_build.observability"]
forbidden_modules = ["fluid_build.build_runners"]
# Direct, indirect, and any-descendant imports all count. The
# canonical SSRF gate now lives in ``fluid_build._net``; there should
# be zero edges from observability into build_runners after the
# 2026-05 hardening.
allow_indirect_imports = false
as_packages = true

[[tool.importlinter.contracts]]
name = "fluid_build._net is tier-0 (no fluid_build upstreams)"
type = "forbidden"
source_modules = ["fluid_build._net"]
forbidden_modules = [
  "fluid_build.cli",
  "fluid_build.observability",
  "fluid_build.build_runners",
  "fluid_build.forge",
  "fluid_build.providers",
  "fluid_build.copilot",
  "fluid_build.api",
  "fluid_build.credentials",
]
# ``_net`` is the tier-0 cross-cutting primitive module (stdlib-only
# SSRF gate today). Any upward edge here would re-create the cycle
# class this contract exists to prevent.
allow_indirect_imports = false
as_packages = true
