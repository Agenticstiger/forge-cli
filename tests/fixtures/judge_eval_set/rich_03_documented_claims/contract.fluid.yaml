fluidVersion: "0.7.3"
kind: DataProduct
id: rich.claims_aggregated_v2
name: Claims Aggregated
description: |
  Aggregate (ADP) view of insurance claims across all lines of business.
  Powers reserve forecasting and loss-ratio dashboards. PII tagged per
  HIPAA where applicable; clustered on policy_number for joins.
domain: insurance

metadata:
  layer: Silver
  productType: ADP
  owner:
    team: actuarial-data
    email: actuarial-data@example.com
    onCallRotation: "PagerDuty - actuarial-data"
  classification: confidential
  refreshCadence: hourly
  sla:
    freshness: "PT2H"
    availability: "99.5%"
  hipaaApplicable: true

retention:
  runState: P30D
  runLogs: P365D
  lineage: P1095D
  data: P2555D

consumes:
  - id: bronze.claims_raw
  - id: silver.policies_dim
  - id: silver.adjusters_dim

builds:
  - id: build_claims_agg
    pattern: transformation
    engine: dbt
    properties:
      materialization: incremental
      uniqueKey: claim_id

exposes:
  - exposeId: claims_agg
    name: fact_claims
    kind: table
    binding:
      platform: snowflake
      format: table
      location:
        database: ACTUARIAL_PROD
        schema: CLAIMS
        table: FACT_CLAIMS
      clustering:
        - policy_number
        - filed_date
    contract:
      schema:
        - name: claim_id
          type: STRING
          primaryKey: true
          nullable: false
          description: "Globally unique claim identifier."
        - name: policy_number
          type: STRING
          nullable: false
          classification: pii_indirect
          masking:
            algorithm: hash_sha256
            scope: non_actuarial_role
          description: "Policy under which the claim was filed. Hashed for non-actuarial readers."
          foreignKey:
            to: dim_policies
            field: policy_number
        - name: claimant_name
          type: STRING
          nullable: false
          classification: pii
          masking:
            algorithm: redact
            scope: non_actuarial_role
          description: "Legal name of the claimant. Redacted outside the actuarial role."
        - name: claim_type
          type: STRING
          nullable: false
          enum: ["auto_collision", "auto_comprehensive", "home_property", "home_liability", "health_medical", "health_dental", "life_term", "life_whole"]
          description: "Specific claim sub-type for actuarial bucketing."
        - name: line_of_business
          type: STRING
          nullable: false
          enum: ["auto", "home", "health", "life"]
          description: "Top-level line of business."
        - name: claim_amount_cents
          type: INT64
          nullable: false
          min: 0
          description: "Initial claim amount filed (cents)."
        - name: paid_amount_cents
          type: INT64
          nullable: false
          min: 0
          description: "Amount actually paid out (cents); 0 if denied or still open."
        - name: deductible_cents
          type: INT64
          nullable: false
          min: 0
          description: "Policy deductible applied (cents)."
        - name: filed_date
          type: DATE
          nullable: false
          description: "Date the claim was filed by the claimant."
        - name: status
          type: STRING
          nullable: false
          enum: ["filed", "under_review", "approved", "denied", "paid", "appealed", "closed"]
          description: "Lifecycle state of the claim."
        - name: adjuster_id
          type: STRING
          nullable: true
          description: "FK to dim_adjusters; null until assigned."
          foreignKey:
            to: dim_adjusters
            field: adjuster_id
        - name: closed_at
          type: TIMESTAMP
          nullable: true
          description: "Timestamp when status entered 'closed' or 'denied' (UTC)."
        - name: updated_at
          type: TIMESTAMP
          nullable: false
          description: "Last source-record update (UTC)."
