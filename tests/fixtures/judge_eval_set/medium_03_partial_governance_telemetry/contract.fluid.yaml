fluidVersion: "0.7.3"
kind: DataProduct
id: medium.telemetry_v1
name: device_telemetry
domain: iot

metadata:
  layer: Bronze
  productType: SDP
  owner:
    team: iot-platform
    email: iot-platform@example.com
  refreshCadence: streaming

models:
  - name: device_metrics
    columns:
      - name: device_id
        type: STRING
        primary_key: true
      - name: tenant_id
        type: STRING
        nullable: false
      - name: metric_name
        type: STRING
        nullable: false
      - name: metric_value
        type: DOUBLE
        nullable: false
      - name: collected_at
        type: TIMESTAMP
        nullable: false
      - name: ingested_at
        type: TIMESTAMP
      - name: firmware_version
        type: STRING
      - name: site_code
        type: STRING
