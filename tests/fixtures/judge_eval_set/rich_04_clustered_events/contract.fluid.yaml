fluidVersion: "0.7.3"
kind: DataProduct
id: rich.events_clickstream_v2
name: Clickstream Events
description: |
  High-volume web/app clickstream events. Source-aligned (SDP) at the
  Bronze layer; partitioned hourly and clustered on (tenant_id,
  event_ts) for cohort + retention analyses. PII (user_id, device_ip)
  is tagged and masked; payload is JSON-parsed and column-projected
  downstream.
domain: analytics

metadata:
  layer: Bronze
  productType: SDP
  owner:
    team: analytics-platform
    email: analytics-platform@example.com
  classification: confidential
  refreshCadence: streaming
  sla:
    freshness: "PT5M"
    availability: "99.9%"
    p95LatencyMs: 200

retention:
  runState: P14D
  runLogs: P90D
  lineage: P365D
  data: P90D

exposes:
  - exposeId: clickstream_raw
    name: events
    kind: table
    binding:
      platform: bigquery
      format: table
      location:
        project: analytics-prod
        dataset: clickstream
        table: events_raw
      clustering:
        - tenant_id
        - event_type
      partitioning:
        column: event_ts
        grain: hour
    contract:
      schema:
        - name: event_id
          type: STRING
          primaryKey: true
          nullable: false
          description: "ULID-encoded event identifier (lexicographically time-orderable)."
        - name: tenant_id
          type: STRING
          nullable: false
          description: "Multi-tenant isolation key. Required on every row."
        - name: user_id
          type: STRING
          nullable: true
          classification: pii
          masking:
            algorithm: hash_sha256
            scope: non_owner_role
          description: "Authenticated user identifier; null for anonymous sessions."
        - name: session_id
          type: STRING
          nullable: false
          description: "Per-session correlation identifier."
        - name: event_type
          type: STRING
          nullable: false
          enum: ["page_view", "click", "scroll", "form_submit", "purchase", "signup", "logout", "error"]
          description: "Top-level event taxonomy."
        - name: event_ts
          type: TIMESTAMP
          nullable: false
          description: "Client-reported event timestamp (UTC, validated server-side)."
        - name: ingested_ts
          type: TIMESTAMP
          nullable: false
          description: "Server-side ingestion timestamp (UTC)."
        - name: device_ip
          type: STRING
          nullable: true
          classification: pii
          masking:
            algorithm: ip_truncate
            scope: non_owner_role
          description: "Source IP, truncated to /24 (IPv4) or /48 (IPv6) for non-owner consumers."
        - name: user_agent
          type: STRING
          nullable: true
          description: "Raw user-agent string; parsed into device/os/browser in Silver."
        - name: url_path
          type: STRING
          nullable: true
          description: "Path component of the current URL (no query string)."
        - name: referrer_host
          type: STRING
          nullable: true
          description: "Host of the referring URL; null when direct navigation."
        - name: utm_campaign
          type: STRING
          nullable: true
          description: "UTM campaign tag."
        - name: utm_source
          type: STRING
          nullable: true
          description: "UTM source tag."
        - name: utm_medium
          type: STRING
          nullable: true
          description: "UTM medium tag."
        - name: payload
          type: STRING
          nullable: true
          description: "Event-specific JSON payload; Silver downstream parses into typed columns."
