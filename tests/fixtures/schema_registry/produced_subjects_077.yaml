# A product that reads one Kafka topic through its registry (verified at fluid plan) and
# produces two: one on the Glue Schema Registry, one on a Confluent registry, each
# registered through OpenTofu from binding.properties.registry (0.7.7 preview).
# Pinned by tests/schema_registry/test_schema_field.py; fluid validate must accept it.
fluidVersion: "0.7.7"
kind: DataProduct
id: commerce.orders-enriched
name: Orders enriched
domain: commerce
metadata:
  layer: Silver
  owner:
    team: commerce-data
packaging:
  mode: isolated
  pool: commerce-platform
  containers:
    cluster: shared
    schemaRegistry: shared
builds:
  - id: enrich-orders
    engine: python
    pattern: embedded-logic
    outputs: [orders_enriched]
    properties:
      sql: SELECT order_id, amount FROM orders
      stream:
        kind: kafka
        topic: commerce.orders
        format: avro-confluent
        registry:
          kind: glue
          registryName: commerce
        schema:
          - name: order_id
            type: string
            required: true
          - name: amount
            type: decimal(18,2)
exposes:
  - exposeId: orders_lake
    kind: table
    binding:
      platform: aws
      format: parquet
      location:
        bucket: commerce-lake
        path: orders/
        region: eu-west-1
    contract:
      schema:
        - name: order_id
          type: string
  - exposeId: orders_enriched
    kind: stream
    binding:
      platform: kafka
      format: kafka_topic
      location:
        topic: commerce.orders-enriched
        host: b-1.msk.example:9098
      serialization:
        value: avro
      properties:
        registry:
          kind: glue
          registryName: commerce
          compatibility: FULL_ALL
    policy:
      classification: Confidential
    contract:
      schema:
        - name: order_id
          type: string
          required: true
        - name: email
          type: string
          sensitivity: pii
        - name: amount
          type: decimal(18,2)
  - exposeId: orders_public
    kind: stream
    binding:
      platform: confluent
      format: kafka_topic
      location:
        topic: commerce.orders-public
      serialization:
        value: json-confluent
      properties:
        registry:
          kind: confluent
          url: https://schema-registry.example.com
    contract:
      schema:
        - name: order_id
          type: string
          required: true
