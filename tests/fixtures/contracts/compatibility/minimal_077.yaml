fluidVersion: "0.7.7"
kind: DataProduct
id: compat.ops.streaming_iceberg_077
name: Streaming Iceberg Compatibility 0.7.7
description: Protects FLUID 0.7.7 compatibility. 0.7.7 opened as the preview when 0.7.6 was promoted to stable, identical to it at open, so this is the 0.7.6 fixture under the 0.7.7 tag.
domain: ops
metadata:
  layer: Bronze
  owner:
    team: platform-ops
    email: ops@example.com

builds:
  - id: ingest_events
    pattern: acquisition
    engine: kafka-connect
    properties:
      source:
        kind: postgres
        mode: incremental_append
        streams:
          - public.events
      sink:
        format: iceberg
      kafka-connect:
        iceberg_sink_enabled: true
        streamingSink:
          autoCreate: true
          commitIntervalMs: 1000

exposes:
  - exposeId: events
    kind: table
    version: "1.0.0"
    binding:
      platform: aws
      format: iceberg
      location:
        database: bronze
        table: events
        bucket: fluid-lake
    contract:
      schema:
        - name: id
          type: integer
          required: true
        - name: payload
          type: string
