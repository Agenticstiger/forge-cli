fluidVersion: "0.7.4"
kind: DataProduct
id: compat.ops.pipeline_health_074
name: Pipeline Health Compatibility 0.7.4
description: Operational health fixture used to protect FLUID 0.7.4 compatibility (adds the MCP output-port + runtime agentPolicy enforcement surface; the underlying transformation path is identical to 0.7.3 so the 0.7.3 baseline carries forward).
domain: ops
metadata:
  layer: Gold
  owner:
    team: platform-ops
    email: ops@example.com

builds:
  - id: pipeline_health_sql
    pattern: embedded-logic
    engine: sql
    properties:
      sql: |
        SELECT
          pipeline_id,
          health_score,
          event_ts
        FROM runtime.pipeline_health

exposes:
  - exposeId: pipeline_health
    kind: table
    version: "1.0.0"
    binding:
      platform: local
      format: parquet
      location:
        path: runtime/compat/pipeline_health_074.parquet
    contract:
      schema:
        - name: pipeline_id
          type: string
          required: true
        - name: health_score
          type: integer
          required: true
        - name: event_ts
          type: timestamp
          required: true
    # NEW in v0.7.4 — the `mcp` block + agentPolicy demonstrating the
    # runtime enforcement gate that ships with the MCP output port.
    mcp:
      sampling:
        maxRows: 100
    policy:
      agentPolicy:
        allowedModels:
          - claude-haiku-4-5-20251001
          - gpt-4o-mini
        allowedUseCases:
          - analysis
          - qa
        deniedUseCases:
          - training
          - fine_tuning
        canStore: false
        auditRequired: true
