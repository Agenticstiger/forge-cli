fluidVersion: "0.7.3"
kind: DataProduct
id: orders-product
name: Orders Product
description: Test fixture v2 — contains intentional breaking and non-breaking changes
metadata:
  owner: data-platform-team
  domain: commerce
  layer: Silver
  productType: ADP
  tags:
    - finance
    - core
    - pii
consumes: []
exposes:
  - id: orders
    type: table
    primaryKey:
      - order_id
    binding:
      platform: snowflake
      location:
        format: TABLE
        properties:
          database: ANALYTICS
          schema: COMMERCE
          table: ORDERS
    schema:
      - name: order_id
        type: BIGINT
        nullable: false
        description: Primary key (immutable)
      - name: customer_id
        type: BIGINT
        nullable: false
      - name: amount
        type: BIGINT
        nullable: true
        description: Order total in cents
      - name: status
        type: VARCHAR
        nullable: false
      - name: created_at
        type: TIMESTAMP
        nullable: true
    quality:
      tests:
        - name: orders_order_id_not_null
          column: order_id
          type: not_null
          severity: error
        - name: orders_amount_positive
          column: amount
          type: range
          min: 0
          severity: warn
agentPolicy:
  allowedModels:
    - gpt-4
    - claude-3-opus
  allowedUseCases:
    - inference
    - summarization
sovereignty:
  allowedRegions:
    - us-east-1
    - eu-west-1
