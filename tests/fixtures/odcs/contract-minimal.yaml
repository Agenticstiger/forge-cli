# Minimal ODCS contract — only required + name fields populated.
version: "1.0.0"
apiVersion: v3.1.0
kind: DataContract
id: minimal.contract
status: draft
name: minimal
schema:
  - name: minimal_table
    logicalType: object
    physicalType: table
    properties:
      - name: id
        logicalType: string
servers:
  - server: local
    type: local
    path: /tmp/minimal
