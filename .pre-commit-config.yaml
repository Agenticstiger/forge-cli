# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '\.venv/|\.egg-info/|__pycache__/|\.pytest_cache/'

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: ['--fix']

  # Architecture / import-cycle linter — runs the contracts declared
  # under ``[tool.importlinter]`` in pyproject.toml. ``language: system``
  # ensures the tool sees the in-venv install of fluid_build (lint-imports
  # must import the package to walk its graph) rather than a fresh
  # isolated env that wouldn't have the project's deps.
  - repo: local
    hooks:
      - id: lint-imports
        name: lint-imports (import-linter contracts)
        entry: lint-imports
        language: system
        pass_filenames: false
        types: [python]
