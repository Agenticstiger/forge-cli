# See https://pre-commit.com for more information
repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: '\.venv/|\.egg-info/|__pycache__/|\.pytest_cache/'

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      - id: ruff
        args: ['--fix']

  # Refuses a commit that carries a value from the committer's own
  # environment — the class detect-secrets structurally cannot see, because
  # an account locator and a username are low-entropy and key-prefix-free.
  # Deliberately NOT ``--all-files``: see the module docstring: this repo's
  # own comments cite the demo database names a lab .env also carries, so a
  # whole-repo run flags pre-existing prose. Staged files only.
  - repo: local
    hooks:
      - id: no-live-env-values
        name: no live environment values in the diff
        entry: python scripts/check_no_live_env_values.py
        language: system
        # Any text file can carry a pasted identifier, not just Python.
        types: [text]

  # Architecture / import-cycle linter — runs the contracts declared
  # under ``[tool.importlinter]`` in pyproject.toml. ``language: system``
  # ensures the tool sees the in-venv install of fluid_build (lint-imports
  # must import the package to walk its graph) rather than a fresh
  # isolated env that wouldn't have the project's deps.
  - repo: local
    hooks:
      - id: lint-imports
        name: lint-imports (import-linter contracts)
        entry: lint-imports
        language: system
        pass_filenames: false
        types: [python]
