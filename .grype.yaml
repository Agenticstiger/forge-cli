# grype scan configuration for the forge-cli release image (consumed by the
# "Scan image for HIGH/CRITICAL CVEs (gate)" step in .github/workflows/release.yml,
# which runs `./grype <image> --fail-on high --only-fixed` from the repo root).
#
# Scope: upstream CPython *binary* CVEs in the python:*-slim base image whose
# fix landed only in a CPython release no stable base image ships yet (grype's DB
# runs ahead of the official Docker images). We suppress ONLY such genuinely
# unfixable-in-stable HIGH/CRITICAL findings; fixable OS-package CVEs are patched
# at build time via `apt-get upgrade` in the Dockerfile, not ignored here.
#
# **Remove each entry the moment a stable base image ships the listed fixed
# version** (re-run grype to confirm). As of 0.11.0 the base is python:3.13-slim
# @ CPython 3.13.14, which already fixed the four previously-ignored CVEs
# (CVE-2026-7210, CVE-2025-13462, CVE-2026-4224, CVE-2026-3644) — those ignores
# were removed here.
ignore:
  # High (CVSS 8.7) — CPU DoS in html.parser.HTMLParser via repeated unterminated
  # markup declarations on untrusted HTML (published 2026-07-09). Fixed only in
  # CPython 3.15.0 / 3.16.0 — no stable Python base carries the fix. Bottom-
  # percentile EPSS (0.6%), and the fluid CLI does not parse attacker-controlled
  # HTML through html.parser.HTMLParser, so it is not reachable in this image.
  # Remove once python:3.13-slim ships a CPython with the backport.
  - vulnerability: CVE-2026-15308

  # High — CVE-2026-11940: tarfile extraction-filter bypass via a crafted archive
  # whose hardlink references a deeper-path symlink, so the fallback recreates the
  # symlink at a shallower path and escapes the destination (incomplete fix of
  # CVE-2025-4330; published 2026). Fixed only in CPython 3.15.0b4 — no stable
  # Python base image carries the fix. NOT REACHABLE in this image: the only tar
  # extraction in the shipped code (fluid_build/forge/core/artifact_fanout.py::
  # _extract_bundle) filters members through _safe_tar_members, which rejects ALL
  # symlink and hardlink members outright (member.issym()/islnk() -> FanoutError)
  # before extraction and re-verifies the bundle MANIFEST (SHA-256 merkle root)
  # first — the link primitive this CVE requires never reaches extractall. The
  # opentofu installer extracts one named regular member only, never extractall.
  # EPSS 0.6% (46th percentile). Remove once a stable python:3.13-slim ships the
  # backport (re-run grype to confirm).
  - vulnerability: CVE-2026-11940

  # High — CVE-2026-11972: tarfile opened in STREAMING mode ("r|...") mishandles
  # EOF on a truncated crafted archive (published 2026). Fixed only in CPython
  # 3.15.0b4 — no stable Python base image carries the fix. NOT REACHABLE in this
  # image: the codebase never opens tar archives in streaming mode (no "r|" usage
  # anywhere in fluid_build/); every tarfile.open is random-access "r:gz"/"w" on a
  # local, MANIFEST-attested file. EPSS 0.4% (35th percentile). Remove once a
  # stable python:3.13-slim ships the backport (re-run grype to confirm).
  - vulnerability: CVE-2026-11972
