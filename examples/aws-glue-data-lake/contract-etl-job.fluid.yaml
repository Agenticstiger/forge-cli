fluidVersion: "0.7.1"
kind: DataProduct
id: analytics.data_lake.sales_etl
name: Sales ETL Job
description: Spark ETL job that reads raw CSV, transforms, and writes to the curated Iceberg table
domain: Analytics

tags:
  - data-lake
  - aws-glue
  - etl
  - spark

labels:
  team: data-engineering
  platform: aws

metadata:
  layer: Silver
  owner:
    team: data-engineering
    email: data-eng@company.com

# ─── Build: Glue Spark ETL Job ──────────────────────────────

build:
  engine: glue
  pattern: multi-stage
  properties:
    stages:
      - name: ensure_database
        dependsOn: []
      - name: run_crawler
        dependsOn: [ensure_database]
      - name: run_etl
        dependsOn: [run_crawler]
      - name: verify_output
        dependsOn: [run_etl]

# ─── Orchestration ───────────────────────────────────────────

orchestration:
  engine: airflow
  airflow:
    dagId: sales_csv_to_iceberg
    schedule: "@daily"

# ─── Expose: ETL Output Table ────────────────────────────────

exposes:
  - exposeId: curated_sales
    title: Curated Sales (ETL Output)
    version: "1.0.0"
    kind: table

    binding:
      platform: aws
      format: iceberg
      location:
        database: sales_db
        table: curated_sales
        bucket: "{{ env.DATA_LAKE_BUCKET }}"
        path: iceberg/sales/curated/
        region: "{{ env.AWS_REGION }}"

    contract:
      schema:
        - name: order_id
          type: string
          required: true
          description: Unique order identifier
        - name: order_date
          type: date
          required: true
          description: Date the order was placed
        - name: customer_id
          type: string
          required: true
          description: Customer identifier
          sensitivity: pseudonymized
        - name: product_sku
          type: string
          required: true
        - name: quantity
          type: integer
          required: true
        - name: unit_price
          type: decimal(10,2)
          required: true
        - name: total_amount
          type: decimal(12,2)
          required: true
