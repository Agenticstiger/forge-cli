fluidVersion: "0.7.2"
kind: "DataProduct"
id: "silver.ote.billing_history_v1"
name: "OTE Billing History"
description: "Curated billing history for OTE."
domain: "Billing"

metadata:
  layer: Silver
  owner:
    team: "OTE Finance Data"
    email: "ote-billing@ote.example"
  businessContext:
    domain: "Finance"
    subdomain: "Billing Operations"

consumes:
  - productId: "bronze.ote.billing_accounts_raw_v1"
    exposeId: "billing_accounts"
    purpose: "Raw billing account data"
  - productId: "bronze.ote.payments_raw_v1"
    exposeId: "payments"
    purpose: "Payment transaction records"

builds:
  - id: "billing_history_aggregation"
    description: "Billing history data transformation"
    pattern: "hybrid-reference"
    engine: "dbt"
    repository: "./models/billing_history"
    properties:
      model: "billing_history"
      vars:
        enforce_semantics: true
    execution:
      trigger:
        type: "schedule"
        cron: "0 2 * * *"
      runtime:
        platform: "snowflake"
        # The README promises "the Snowflake runtime is configured explicitly
        # with warehouse, database, schema, and role" — so declare them.
        # These are what the build actually executes against.
        resources:
          warehouse: "{{ env.SNOWFLAKE_WAREHOUSE }}"
          database: "{{ env.SNOWFLAKE_DATABASE }}"
          schema: "{{ env.SNOWFLAKE_SCHEMA }}"
          role: "{{ env.SNOWFLAKE_ROLE }}"
      retries:
        count: 2
        delaySeconds: 120
        backoff: "exponential"

exposes:
  - exposeId: "billing_history_table"
    kind: "table"
    binding:
      platform: "snowflake"
      format: "snowflake_table"
      location:
        # Environment-resolved, like ../smoke. These were hardcoded to
        # OTE_ACCT / OTE_ANALYTICS / SILVER, which meant anyone running the
        # example as documented provisioned a brand-new top-level
        # OTE_ANALYTICS database in their own account and ignored their
        # SNOWFLAKE_DATABASE / SNOWFLAKE_SCHEMA entirely.
        account: "{{ env.SNOWFLAKE_ACCOUNT }}"
        database: "{{ env.SNOWFLAKE_DATABASE }}"
        schema: "{{ env.SNOWFLAKE_SCHEMA }}"
        table: "BILLING_HISTORY_V1"
    contract:
      schema:
        - name: "billing_account_id"
          type: "STRING"
          required: true
        - name: "cycle_start"
          type: "TIMESTAMP"
        - name: "cycle_end"
          type: "TIMESTAMP"
        - name: "total_amount"
          type: "DECIMAL"
          required: true
      dq:
        rules:
          - id: "billing_account_id_not_null"
            type: "completeness"
            selector: "billing_account_id"
            threshold: 1.0
            operator: ">="
            severity: "error"
    qos:
      availability: "99.0%"
      freshnessSLO: "PT2H"
