# nginx production-shape reverse proxy for `fluid mcp output-port
# serve --transport http`. Equivalent to the Caddyfile in this dir
# but for shops standardised on nginx.

worker_processes auto;
events { worker_connections 1024; }

http {
  log_format json escape=json
    '{"ts":"$time_iso8601","client_cn":"$ssl_client_s_dn",'
    '"client_fp":"$ssl_client_fingerprint","status":$status,'
    '"path":"$request_uri","upstream":"$upstream_addr","ms":$request_time}';
  access_log /var/log/nginx/forge-mcp.access.json json;
  error_log  /var/log/nginx/forge-mcp.error.log warn;

  upstream forge_mcp {
    server 127.0.0.1:8765;
    keepalive 16;
  }

  server {
    listen 443 ssl http2;
    server_name mcp.your-domain.example;

    # 1. Server TLS (replace with paths to your CA-signed pair).
    ssl_certificate     /etc/ssl/forge-mcp/server.pem;
    ssl_certificate_key /etc/ssl/forge-mcp/server.key;
    ssl_protocols       TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 2. mTLS: every client must present a cert signed by the
    # trusted CA. ssl_verify_client=on rejects connections without
    # a cert at TLS handshake — the gateway never sees them.
    ssl_client_certificate /etc/ssl/forge-mcp/clients-ca.pem;
    ssl_verify_client      on;
    ssl_verify_depth       2;

    # 3. Belt-and-suspenders bearer token check at the proxy layer.
    # The gateway also enforces this when FLUID_MCP_AUTH_TOKEN is
    # set; running both means the gateway never sees unauth traffic.
    set $expected "Bearer your-shared-secret-here";
    if ($http_authorization != $expected) {
      return 401 '{"error":"unauthorized","message":"missing or invalid bearer token at proxy"}';
    }

    location / {
      proxy_pass         http://forge_mcp;
      proxy_http_version 1.1;
      # SSE: don't buffer, allow long-lived streams.
      proxy_buffering    off;
      proxy_read_timeout 1d;
      proxy_send_timeout 1d;

      # Forward client cert metadata so the gateway can stamp the
      # audit event with cryptographic identity (beyond bearer token).
      proxy_set_header   X-Client-CN          $ssl_client_s_dn;
      proxy_set_header   X-Client-Fingerprint $ssl_client_fingerprint;
      proxy_set_header   X-Forwarded-For      $remote_addr;
      proxy_set_header   Host                 $host;
    }
  }
}
