name: Bug Report
description: Report a bug in FLUID Forge CLI
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: input
    id: version
    attributes:
      label: FLUID Forge Version
      description: "Run `fluid version` to get this."
      placeholder: "0.7.1"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: "Run `python3 --version`."
      placeholder: "3.11.5"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux (Ubuntu/Debian)
        - Linux (RHEL/CentOS)
        - Linux (Other)
        - Windows
        - Docker/Container
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the behavior.
      value: |
        1. Create contract with ...
        2. Run `fluid validate ...`
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: contract
    attributes:
      label: Contract YAML (if applicable)
      description: Paste your contract file (redact any secrets or account IDs).
      render: yaml

  - type: textarea
    id: logs
    attributes:
      label: Error Output / Logs
      description: Paste the full error output. Run with `--log-level DEBUG` for verbose output.
      render: shell

  - type: dropdown
    id: provider
    attributes:
      label: Provider
      description: Which provider are you using?
      options:
        - local (DuckDB)
        - gcp (BigQuery)
        - snowflake
        - aws
        - odps
        - N/A

  - type: dropdown
    id: source-catalog
    attributes:
      label: Source Catalog
      description: |
        If the bug involves `fluid forge data-model from-source` (V1.5
        catalog integration), pick the catalog you're reading FROM.
        Leave on "N/A" for any non-catalog bug.
      options:
        - N/A
        - snowflake (Horizon)
        - databricks (Unity)
        - bigquery
        - dataplex
        - aws (Glue)
        - datahub
        - datamesh_manager

  - type: input
    id: catalog-version
    attributes:
      label: Catalog Version / Edition
      description: |
        Only required for catalog bugs. The catalog SDK or API
        version. Examples — Snowflake: account edition (Standard /
        Enterprise / Business Critical) and Snowflake version from
        `SELECT CURRENT_VERSION()`. Databricks: workspace tier
        (Standard / Premium / Enterprise) and runtime if relevant.
        BigQuery / Dataplex: leave blank (versionless). Glue:
        region (e.g. `us-east-1`). DataHub: server version
        (Profile → About). Data Mesh Manager: SaaS version (footer).
      placeholder: "e.g. Snowflake Enterprise 8.18.1"

  - type: textarea
    id: catalog-snippet
    attributes:
      label: Redacted INFORMATION_SCHEMA snippet (optional)
      description: |
        For catalog bugs, paste a redacted output from
        `INFORMATION_SCHEMA.COLUMNS` (or the equivalent on your
        catalog) for the table that triggered the bug. Strip
        descriptions / tags / PII / account IDs. This is the
        single most useful piece of context for catalog-bug triage —
        it shows the exact metadata shape forge-cli received.
      render: shell
      placeholder: |
        TABLE_NAME=orders
        COLUMN_NAME=customer_id  DATA_TYPE=NUMBER  IS_NULLABLE=NO  COMMENT=<redacted>
        ...
