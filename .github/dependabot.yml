version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
  - package-ecosystem: pip
    directory: /examples/bitcoin-price-api-imperative-part-a
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
  - package-ecosystem: maven
    directory: /examples/flink-iceberg/runtime
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    ignore:
      # The Flink line is chosen together with the Iceberg and Kafka connector
      # builds (both are named for 1.20) and with the image tag in the Dockerfile,
      # so a Flink minor or major is a deliberate change, not a weekly bump.
      - dependency-name: "org.apache.flink:*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  - package-ecosystem: docker
    directory: /examples/flink-iceberg/runtime
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
    ignore:
      - dependency-name: "flink"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(ci)"
    labels:
      - ci
    groups:
      # Dependabot treats codeql-action's init, analyze and upload-sarif as
      # separate dependencies and bumps each in its own PR. CodeQL fails any
      # run whose steps are on different versions ("Loaded a configuration
      # file for version X, but running version Y"), so they move together.
      codeql-action:
        patterns:
          - "github/codeql-action*"
  - package-ecosystem: npm
    directory: /scripts/conformance
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    labels:
      - dependencies
