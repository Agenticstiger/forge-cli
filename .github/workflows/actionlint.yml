# Validates GitHub Actions workflow YAML on every PR.
#
# Catches the failure modes that single-repo secret-scoping depends on:
#   • A maintainer accidentally adds `pull_request_target:` to a workflow
#     that has access to secrets — the worst-case secret-leak shape.
#   • A workflow file has a typo that silently makes it never run.
#   • An action is referenced by floating tag instead of pinned SHA.
#
# Runs on every push and PR (including from forks, since it has no
# secrets to leak). Read-only.

name: actionlint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Run actionlint
        uses: reviewdog/action-actionlint@d290e336d5a743810aef4404f757dc862276d2ae  # v1.73.4
        with:
          fail_level: error

      # Belt-and-suspenders: explicitly grep for the dangerous patterns
      # that actionlint won't catch but that would let a fork PR read
      # secrets if introduced.
      #
      # The check is anchored to the trigger key shape (whitespace then
      # `pull_request_target:` at the start of a line) so it ignores
      # comments and string literals that just mention the keyword.
      #
      # Some pre-existing workflows use `pull_request_target` for
      # documented-safe purposes — they are listed in the allowlist
      # below. Adding a workflow to the allowlist requires explicit
      # security review (CODEOWNERS gate on .github/workflows/*).
      - name: Check for pull_request_target trigger outside allowlist
        run: |
          allowlist='/(actionlint|docs-reminder|welcome|labeler|integration-label-guard)\.yml:'
          violations=$(grep -rEn '^[[:space:]]*pull_request_target[[:space:]]*:' .github/workflows/ \
            | grep -Ev "$allowlist" || true)
          if [ -n "$violations" ]; then
            echo "::error::pull_request_target trigger used outside the audited allowlist:"
            echo "$violations"
            echo "::error::pull_request_target on fork PRs grants write+secrets access."
            echo "::error::If this usage is genuinely safe, add the workflow to the allowlist"
            echo "::error::in .github/workflows/actionlint.yml AFTER security review."
            exit 1
          fi
          echo "No new pull_request_target trigger outside the audited allowlist."

      # Sanity check: integration.yml must NEVER list pull_request as a
      # trigger. The whole secret-scoping design depends on this.
      - name: Check integration.yml trigger purity
        run: |
          if [ -f .github/workflows/integration.yml ]; then
            if grep -E "^\s*pull_request:" .github/workflows/integration.yml; then
              echo "::error::integration.yml has a pull_request trigger."
              echo "::error::That would expose cloud secrets to fork PRs."
              echo "::error::Remove the pull_request trigger or move tests to ci.yml."
              exit 1
            fi
            echo "integration.yml triggers OK."
          fi

      # Sanity check: the admin lanes run heavier / credentialed work
      # against PR code, so each MUST be bound to its environment, which
      # is what scopes which secrets the lane can read at all. An edit
      # that drops the `environment:` line would silently un-gate it.
      - name: Check admin lanes are environment-gated
        run: |
          fail=0
          check() {
            file=".github/workflows/$1"
            env="$2"
            [ -f "$file" ] || return 0
            if grep -Eq "^[[:space:]]*environment:[[:space:]]*${env}[[:space:]]*$" "$file"; then
              echo "${file} is environment-gated (${env}) OK."
            else
              echo "::error::${file} must declare 'environment: ${env}'."
              echo "::error::The environment scopes which secrets this lane can"
              echo "::error::read at all; without it the lane widens to every"
              echo "::error::secret the repo holds."
              fail=1
            fi
          }
          check integration-live.yml integration-live
          check integration-emulated-heavy.yml integration-emulated
          [ "$fail" -eq 0 ]

      # Sanity check: the environment scopes the SECRET, but what gates
      # un-reviewed PR code is the `ci:integration-emulated` label, which
      # integration-label-guard.yml strips on every push so the vouch is
      # re-earned per push. integration-emulated-heavy.yml no longer
      # carries a required-reviewer rule (it ran nightly and unattended;
      # a reviewer gate there just queues runs until they are cancelled,
      # which is how the lane sat dead from 2026-07-13). So the label
      # condition is now load-bearing and has to be enforced here rather
      # than assumed.
      - name: Check the emulated lane still gates PR code on its label
        run: |
          file=.github/workflows/integration-emulated-heavy.yml
          if [ ! -f "$file" ]; then
            echo "No ${file} — nothing to check."
            exit 0
          fi
          if ! grep -q "contains(github.event.pull_request.labels.\*.name, 'ci:integration-emulated')" "$file"; then
            echo "::error::${file} has a pull_request trigger but no"
            echo "::error::ci:integration-emulated label condition. That would run"
            echo "::error::un-vouched PR code with the environment's secrets in scope."
            exit 1
          fi
          echo "${file} gates its pull_request path on the label OK."

          # The guard that makes the label mean something per push.
          if [ ! -f .github/workflows/integration-label-guard.yml ]; then
            echo "::error::integration-label-guard.yml is missing — the"
            echo "::error::ci:integration-emulated label would survive new pushes,"
            echo "::error::so one vouch would cover every later commit."
            exit 1
          fi
          echo "integration-label-guard.yml present OK."
