name: Docs Reminder

on:
  pull_request_target:
    types: [opened, edited, synchronize]
    branches: [main]

permissions:
  pull-requests: write
  issues: write

jobs:
  check-docs:
    runs-on: ubuntu-latest
    steps:
      # Safe with pull_request_target: with no ref, checkout fetches the base
      # branch's own revision, never the PR head, and the job only reads PR
      # metadata and updates labels/comments through the GitHub API.
      - name: Checkout base revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Check for documentation reference
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { runDocsReminder } = require('./scripts/docs_reminder.js');
            await runDocsReminder({ github, context, core });
