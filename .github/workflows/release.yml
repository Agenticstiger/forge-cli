# Release Pipeline — publish to PyPI (via TestPyPI), GHCR, GitHub Releases.
#
# Triggers:
#   - Push a tag matching v*.*.* (e.g. v0.7.1, v0.7.1a1, v0.7.1b2)
#   - Manual workflow_dispatch with a tag input
#
# Promotion model (every release passes through TestPyPI first):
#
#   quality-gate
#       └─ build
#           └─ publish-testpypi          (always, every tag)
#               └─ verify-testpypi       (always; install + smoke from TestPyPI)
#                   ├─ publish-pypi      (only when tag is stable; gated by
#                   │       └─ verify-pypi    verify-testpypi success)
#                   ├─ docker            (after TestPyPI verify, regardless
#                   └─ github-release     of stable/pre)
#
# Pre-release tags (containing a/b/rc/dev) stop after verify-testpypi.
# Stable tags get promoted to PyPI only if the TestPyPI install smoke passes.
#
# Wheel version comes from the git tag via setuptools-scm — no static
# `version = "..."` literal in pyproject.toml to drift.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.7.1, v0.7.1a1)"
        required: true
        type: string

# Don't let two simultaneous tag pushes race PyPI uploads.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}  # Job-level permissions only — least privilege

env:
  PACKAGE_NAME: data-product-forge
  PYTHON_VERSION: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Quality gate — must pass before any publishing
  # ──────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      profile: ${{ steps.meta.outputs.profile }}
    steps:
      - uses: actions/checkout@v5

      - name: Parse version metadata
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Strip leading 'v'
          VERSION="${TAG#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "$VERSION" == *a* ]] || [[ "$VERSION" == *dev* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "profile=alpha" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *b* ]] || [[ "$VERSION" == *rc* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "profile=beta" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "profile=stable" >> "$GITHUB_OUTPUT"
          fi

          echo "Tag: ${TAG}"
          echo "Version: ${VERSION}"

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,local]" || pip install -e ".[dev]"

      - name: Lint
        run: |
          pip install "black==24.10.0"
          ruff check fluid_build/ tests/
          black --check fluid_build/ tests/

      - name: Tests with coverage
        run: |
          pip install pytest-cov
          # Tests known to fail in specific environments are now marked with
          # @pytest.mark.skipif / @pytest.mark.xfail in the test files
          # themselves (with explicit reasons). No deselect flags needed here.
          pytest --cov=fluid_build --cov-report=xml --cov-report=term-missing -q

      - name: Security scan
        run: |
          pip install bandit
          bandit -r fluid_build/ -c pyproject.toml --severity-level medium -q

      # Note: there is no longer a "Verify version matches tag" step.
      # With setuptools-scm, the wheel version IS the tag (no static
      # `version = "..."` in pyproject.toml to drift from). The build
      # job's "Isolated wheel install and verify" step asserts
      # `fluid --version` matches what setuptools-scm produced.
          echo "Version verified: ${TAG_VERSION} (base matches ${PKG_VERSION})"

  # ──────────────────────────────────────────────────────────────
  # 2. Build distribution artifacts
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build Package
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          pip install --upgrade pip build twine

      - name: Build wheel and sdist
        env:
          FLUID_BUILD_PROFILE: ${{ needs.quality-gate.outputs.profile }}
        run: python -m build

      - name: Strict metadata check
        run: twine check --strict dist/*

      - name: Isolated wheel install and verify
        run: |
          python -m venv /tmp/test-install
          /tmp/test-install/bin/pip install dist/*.whl

          # Verify import resolves from site-packages
          INSTALL_PATH=$(/tmp/test-install/bin/python -I -c "import fluid_build; print(fluid_build.__file__)")
          echo "Installed at: ${INSTALL_PATH}"
          if [[ "$INSTALL_PATH" != */site-packages/* ]]; then
            echo "::error::fluid_build resolved outside site-packages"
            exit 1
          fi

          # Verify critical runtime assets
          /tmp/test-install/bin/python -I -c "
          from pathlib import Path
          import fluid_build
          pkg = Path(fluid_build.__file__).parent
          assert (pkg / 'build-manifest.yaml').exists(), 'build-manifest.yaml missing'
          assert (pkg / 'templates' / 'hello-world' / 'contract.fluid.yaml').exists(), 'template missing'
          assert (pkg / 'schemas').is_dir(), 'schemas dir missing'
          print('All runtime assets verified')
          "

          # Verify CLI and version
          /tmp/test-install/bin/fluid --version

          # Functional scaffold check
          cd /tmp
          /tmp/test-install/bin/fluid init release-smoke --template hello-world
          test -f release-smoke/contract.fluid.yaml || { echo "::error::scaffold failed"; exit 1; }
          echo "Release smoke test passed"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # 3a. Publish to TestPyPI — every release goes here first.
  # ──────────────────────────────────────────────────────────────
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [quality-gate, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/data-product-forge
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0
        with:
          repository-url: https://test.pypi.org/legacy/

  # ──────────────────────────────────────────────────────────────
  # 3a-verify. Install from TestPyPI and smoke-test the package.
  # Always runs; gates the PyPI promotion below.
  # ──────────────────────────────────────────────────────────────
  verify-testpypi:
    name: Verify TestPyPI Install
    needs: [quality-gate, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Wait for TestPyPI index
        run: sleep 30

      - name: Install from TestPyPI
        run: |
          python -m venv /tmp/testpypi-verify
          /tmp/testpypi-verify/bin/pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "data-product-forge==${{ needs.quality-gate.outputs.version }}"

      - name: Verify installed package
        run: |
          # Verify import and version
          /tmp/testpypi-verify/bin/python -I -c "
          import fluid_build
          assert fluid_build.__version__ == '${{ needs.quality-gate.outputs.version }}', \
              f'Version mismatch: {fluid_build.__version__}'
          print(f'Version OK: {fluid_build.__version__}')
          "

          # Verify runtime assets
          /tmp/testpypi-verify/bin/python -I -c "
          from pathlib import Path
          import fluid_build
          pkg = Path(fluid_build.__file__).parent
          assert (pkg / 'build-manifest.yaml').exists(), 'build-manifest.yaml missing from wheel'
          assert (pkg / 'templates' / 'hello-world' / 'contract.fluid.yaml').exists(), 'template missing from wheel'
          assert (pkg / 'schemas').is_dir(), 'schemas dir missing from wheel'
          print('All runtime assets present')
          "

          # Verify CLI
          /tmp/testpypi-verify/bin/fluid --version

          # Functional scaffold test
          cd /tmp
          /tmp/testpypi-verify/bin/fluid init testpypi-scaffold --template hello-world
          test -f testpypi-scaffold/contract.fluid.yaml || { echo '::error::scaffold failed'; exit 1; }
          echo "TestPyPI package verified successfully"

  # ──────────────────────────────────────────────────────────────
  # 3b. Publish to PyPI — stable tags only, gated by TestPyPI verify.
  # ──────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [quality-gate, verify-testpypi]
    if: needs.quality-gate.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/data-product-forge
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e  # v1.13.0

  # ──────────────────────────────────────────────────────────────
  # 3b-verify. Install from PyPI and smoke-test (final gate).
  # ──────────────────────────────────────────────────────────────
  verify-pypi:
    name: Verify PyPI Install
    needs: [quality-gate, publish-pypi]
    if: needs.quality-gate.outputs.is_prerelease == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Wait for PyPI index
        run: sleep 30

      - name: Install from PyPI
        run: |
          python -m venv /tmp/pypi-verify
          /tmp/pypi-verify/bin/pip install \
            "data-product-forge==${{ needs.quality-gate.outputs.version }}"

      - name: Verify installed package
        run: |
          /tmp/pypi-verify/bin/python -I -c "
          import fluid_build
          assert fluid_build.__version__ == '${{ needs.quality-gate.outputs.version }}', \
              f'Version mismatch: {fluid_build.__version__}'
          print(f'Version OK: {fluid_build.__version__}')
          "
          /tmp/pypi-verify/bin/fluid --version
          cd /tmp
          /tmp/pypi-verify/bin/fluid init pypi-verify-scaffold --template hello-world
          test -f pypi-verify-scaffold/contract.fluid.yaml || { echo '::error::scaffold failed'; exit 1; }
          echo "PyPI package verified successfully"

  # ──────────────────────────────────────────────────────────────
  # 4. GitHub Release with changelog and artifacts (after TestPyPI verify).
  # ──────────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [quality-gate, verify-testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Generate release notes
        id: notes
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${{ needs.quality-gate.outputs.version }}"
          PROFILE="${{ needs.quality-gate.outputs.profile }}"
          IS_PRE="${{ needs.quality-gate.outputs.is_prerelease }}"

          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          cat > release-notes.md << 'HEADER'
          ## Installation

          ```bash
          pip install data-product-forge
          ```

          Or with extras:
          ```bash
          pip install "data-product-forge[local]"       # DuckDB local provider
          pip install "data-product-forge[gcp]"         # Google Cloud provider
          pip install "data-product-forge[snowflake]"   # Snowflake provider
          pip install "data-product-forge[all]"         # Everything
          ```

          HEADER

          if [ "$IS_PRE" = "true" ]; then
            cat >> release-notes.md << EOF

          > **Pre-release** ($PROFILE) — not recommended for production use.
          >
          > Install from TestPyPI:
          > \`\`\`bash
          > pip install --index-url https://test.pypi.org/simple/ --extra-index-url https://pypi.org/simple/ data-product-forge==${VERSION}
          > \`\`\`

          EOF
          fi

          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since ${PREV_TAG}" >> release-notes.md
            echo "" >> release-notes.md
            git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" >> release-notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "FLUID Build ${{ needs.quality-gate.outputs.version }}"
          body_path: release-notes.md
          prerelease: ${{ needs.quality-gate.outputs.is_prerelease == 'true' }}
          files: dist/*

  # ──────────────────────────────────────────────────────────────
  # 5. Build and push Docker image to GHCR
  # ──────────────────────────────────────────────────────────────
  docker:
    name: Docker Image (GHCR)
    needs: [quality-gate, verify-testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      - name: Download wheel
        uses: actions/download-artifact@v5
        with:
          name: dist
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.quality-gate.outputs.profile }}-latest
            type=raw,value=latest,enable=${{ needs.quality-gate.outputs.is_prerelease == 'false' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            PROFILE=${{ needs.quality-gate.outputs.profile }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
