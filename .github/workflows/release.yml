# Release Pipeline — publish to PyPI (via TestPyPI), GHCR, GitHub Releases.
#
# Design principles (matching modern Python OSS like Ruff / HTTPX / Pydantic):
#
#   1. Trust the PR-time CI.
#      Branch protection on `main` requires `ci.yml` to pass before merge.
#      This workflow does NOT re-run lint / pytest / bandit — `quality-gate`
#      is a lightweight tag-shape + CI-green check (~10 s).
#
#   2. Every release is cryptographically signed.
#      `pypa/gh-action-pypi-publish` uploads each wheel with a Sigstore
#      attestation (`attestations: true`). `actions/attest-build-provenance`
#      attaches an in-toto SLSA build provenance to every artifact. Both
#      use GitHub OIDC — no long-lived secrets.
#
#   3. Release notes come from CHANGELOG.md, not git log.
#      The GitHub Release body is extracted from the matching `## [X.Y.Z]`
#      section of CHANGELOG.md; falls back to git log if the entry is
#      missing (warning, not failure).
#
# Triggers:
#   - Push a tag matching v*.*.* (e.g. v0.7.1, v0.7.1a1, v0.7.1b2)
#   - Manual workflow_dispatch with a tag input
#
# Promotion model (every release passes through TestPyPI first):
#
#   quality-gate
#       └─ build
#           └─ publish-testpypi          (always, every tag; + Sigstore)
#               └─ verify-testpypi       (always; install + smoke from TestPyPI)
#                   ├─ publish-pypi      (stable only; gated by verify-testpypi)
#                   │       └─ verify-pypi    (final smoke from real PyPI)
#                   ├─ docker            (after TestPyPI verify, regardless
#                   └─ github-release     of stable/pre)
#
# All tags (stable and pre-release) promote to PyPI after the TestPyPI
# install smoke passes. Pre-releases are PEP 440 pre-release versions
# (a / b / rc / .dev) so `pip install data-product-forge` skips them by
# default — only `pip install --pre` or an explicit `==X.Y.ZrcN` pin
# picks them up.
#
# Wheel version comes from the git tag via setuptools-scm — no static
# `version = "..."` literal in pyproject.toml to drift.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.7.1, v0.7.1a1)"
        required: true
        type: string

# Don't let two simultaneous tag pushes race PyPI uploads.
concurrency:
  group: release
  cancel-in-progress: false

permissions: {}  # Job-level permissions only — least privilege

env:
  PACKAGE_NAME: data-product-forge
  PYTHON_VERSION: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Quality gate — tag-shape + CI-green check. No lint/test re-run.
  #
  # Branch protection on `main` already requires `ci.yml` to pass before
  # merge, so the commit we're tagging has been exercised end-to-end.
  # This gate just validates the tag shape and confirms the commit's
  # CI run concluded successfully. ~10 seconds.
  # ──────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read            # read the matching ci.yml run status
    outputs:
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      profile: ${{ steps.meta.outputs.profile }}
    steps:
      - name: Parse & validate tag shape
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          # Strict PEP 440 / semver-compatible shape with optional
          # pre-release suffix (a / b / rc / .dev).
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|\.dev[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid vX.Y.Z[(a|b|rc)N|.devN] form"
            exit 1
          fi
          VERSION="${TAG#v}"
          if   [[ "$VERSION" == *a*    ]]; then PROFILE=alpha; PRE=true
          elif [[ "$VERSION" == *b*    ]]; then PROFILE=beta;  PRE=true
          elif [[ "$VERSION" == *rc*   ]]; then PROFILE=rc;    PRE=true
          elif [[ "$VERSION" == *.dev* ]]; then PROFILE=dev;   PRE=true
          else                                   PROFILE=stable; PRE=false
          fi
          {
            echo "version=$VERSION"
            echo "is_prerelease=$PRE"
            echo "profile=$PROFILE"
          } >> "$GITHUB_OUTPUT"
          echo "Tag '$TAG' parsed as version='$VERSION' profile='$PROFILE' is_prerelease='$PRE'"

      - name: Assert tag points at a commit whose ci.yml is green
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              head_sha: context.sha,
              per_page: 1,
            });
            const latest = runs.workflow_runs[0];
            if (!latest) {
              core.setFailed(
                `No ci.yml run found for commit ${context.sha}. ` +
                `Did you tag a commit before its PR CI finished?`,
              );
              return;
            }
            if (latest.conclusion !== "success") {
              core.setFailed(
                `Latest ci.yml run on ${context.sha} concluded '${latest.conclusion}'. ` +
                `Refusing to release from a non-green commit. Run: ${latest.html_url}`,
              );
              return;
            }
            core.notice(`ci.yml on ${context.sha}: ${latest.conclusion} (${latest.html_url})`);

  # ──────────────────────────────────────────────────────────────
  # 2. Build distribution artifacts
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build Package
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write          # Sigstore / OIDC
      attestations: write      # SLSA build provenance
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          # setuptools-scm needs full history + all tags to derive the version.
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build tools
        run: |
          pip install --upgrade pip build twine

      - name: Build wheel and sdist
        env:
          FLUID_BUILD_PROFILE: ${{ needs.quality-gate.outputs.profile }}
        run: python -m build

      - name: Strict metadata check
        run: twine check --strict dist/*

      - name: Attest build provenance (SLSA)
        # Creates an in-toto attestation proving each dist artifact was built
        # by this workflow / this commit. Verifiable via `gh attestation verify`
        # or the Sigstore CLI.
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-path: "dist/*"

      - name: Isolated wheel install and verify
        run: |
          python -m venv /tmp/test-install
          /tmp/test-install/bin/pip install dist/*.whl

          # Verify import resolves from site-packages
          INSTALL_PATH=$(/tmp/test-install/bin/python -I -c "import fluid_build; print(fluid_build.__file__)")
          echo "Installed at: ${INSTALL_PATH}"
          if [[ "$INSTALL_PATH" != */site-packages/* ]]; then
            echo "::error::fluid_build resolved outside site-packages"
            exit 1
          fi

          # Verify critical runtime assets
          /tmp/test-install/bin/python -I -c "
          from pathlib import Path
          import fluid_build
          pkg = Path(fluid_build.__file__).parent
          assert (pkg / 'build-manifest.yaml').exists(), 'build-manifest.yaml missing'
          assert (pkg / 'templates' / 'hello-world' / 'contract.fluid.yaml').exists(), 'template missing'
          assert (pkg / 'schemas').is_dir(), 'schemas dir missing'
          print('All runtime assets verified')
          "

          # Verify CLI and version
          /tmp/test-install/bin/fluid --version

          # Functional scaffold check
          cd /tmp
          /tmp/test-install/bin/fluid init release-smoke --template hello-world
          test -f release-smoke/contract.fluid.yaml || { echo "::error::scaffold failed"; exit 1; }
          echo "Release smoke test passed"

      - name: Generate CycloneDX SBOM
        # SBOM of exactly what the released wheel installs (the isolated
        # venv built above). Shipped as a release artifact for supply-chain
        # transparency — what JFrog Xray / CRA-minded consumers expect.
        run: |
          pip install "cyclonedx-bom==7.3.0"
          cyclonedx-py environment /tmp/test-install \
            --of JSON --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: dist
          path: dist/
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # 3a. Publish to TestPyPI — every release goes here first.
  # ──────────────────────────────────────────────────────────────
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [quality-gate, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/data-product-forge
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI (with Sigstore attestations)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  # ──────────────────────────────────────────────────────────────
  # 3a-verify. Install from TestPyPI and smoke-test the package.
  # Always runs; gates the PyPI promotion below.
  # ──────────────────────────────────────────────────────────────
  verify-testpypi:
    name: Verify TestPyPI Install
    needs: [quality-gate, publish-testpypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Wait for TestPyPI index
        run: sleep 30

      - name: Install from TestPyPI
        run: |
          python -m venv /tmp/testpypi-verify
          /tmp/testpypi-verify/bin/pip install \
            --index-url https://test.pypi.org/simple/ \
            --extra-index-url https://pypi.org/simple/ \
            "data-product-forge==${{ needs.quality-gate.outputs.version }}"

      - name: Verify installed package
        run: |
          # Verify import and version
          /tmp/testpypi-verify/bin/python -I -c "
          import fluid_build
          assert fluid_build.__version__ == '${{ needs.quality-gate.outputs.version }}', \
              f'Version mismatch: {fluid_build.__version__}'
          print(f'Version OK: {fluid_build.__version__}')
          "

          # Verify runtime assets
          /tmp/testpypi-verify/bin/python -I -c "
          from pathlib import Path
          import fluid_build
          pkg = Path(fluid_build.__file__).parent
          assert (pkg / 'build-manifest.yaml').exists(), 'build-manifest.yaml missing from wheel'
          assert (pkg / 'templates' / 'hello-world' / 'contract.fluid.yaml').exists(), 'template missing from wheel'
          assert (pkg / 'schemas').is_dir(), 'schemas dir missing from wheel'
          print('All runtime assets present')
          "

          # Verify CLI
          /tmp/testpypi-verify/bin/fluid --version

          # Functional scaffold test
          cd /tmp
          /tmp/testpypi-verify/bin/fluid init testpypi-scaffold --template hello-world
          test -f testpypi-scaffold/contract.fluid.yaml || { echo '::error::scaffold failed'; exit 1; }
          echo "TestPyPI package verified successfully"

  # ──────────────────────────────────────────────────────────────
  # 3b. Publish to PyPI — stable tags only, gated by TestPyPI verify.
  # ──────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [quality-gate, verify-testpypi]
    # All tags promote to PyPI once the TestPyPI install smoke passes.
    # Pre-releases (rc/b/a/dev) are PEP 440 pre-release versions; PyPI
    # treats them as such, and `pip install` skips them by default
    # (only `pip install --pre` or `==X.Y.ZrcN` opts in).
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    environment:
      name: pypi
      url: https://pypi.org/p/data-product-forge
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (with Sigstore attestations)
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # v1.14.0
        with:
          attestations: true

  # ──────────────────────────────────────────────────────────────
  # 3b-verify. Install from PyPI and smoke-test (final gate).
  # ──────────────────────────────────────────────────────────────
  verify-pypi:
    name: Verify PyPI Install
    needs: [quality-gate, publish-pypi]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Wait for PyPI index
        run: sleep 30

      - name: Install from PyPI
        run: |
          python -m venv /tmp/pypi-verify
          /tmp/pypi-verify/bin/pip install \
            "data-product-forge==${{ needs.quality-gate.outputs.version }}"

      - name: Verify installed package
        run: |
          /tmp/pypi-verify/bin/python -I -c "
          import fluid_build
          assert fluid_build.__version__ == '${{ needs.quality-gate.outputs.version }}', \
              f'Version mismatch: {fluid_build.__version__}'
          print(f'Version OK: {fluid_build.__version__}')
          "
          /tmp/pypi-verify/bin/fluid --version
          cd /tmp
          /tmp/pypi-verify/bin/fluid init pypi-verify-scaffold --template hello-world
          test -f pypi-verify-scaffold/contract.fluid.yaml || { echo '::error::scaffold failed'; exit 1; }
          echo "PyPI package verified successfully"

  # ──────────────────────────────────────────────────────────────
  # 4. GitHub Release with changelog and artifacts (after TestPyPI verify).
  # ──────────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [quality-gate, verify-testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0

      - name: Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Generate release notes from CHANGELOG.md
        id: notes
        # Extracts the '## [X.Y.Z] — date' section body from CHANGELOG.md.
        # Pre-release suffixes are stripped for lookup: v0.7.11a1 reads the
        # [0.7.11] section. If no matching section exists, falls back to a
        # git log since the previous tag (emitted as a workflow warning).
        run: |
          set -euo pipefail
          VERSION="${{ needs.quality-gate.outputs.version }}"
          PROFILE="${{ needs.quality-gate.outputs.profile }}"
          IS_PRE="${{ needs.quality-gate.outputs.is_prerelease }}"

          # Strip pre-release suffix for CHANGELOG lookup.
          BASE=$(echo "$VERSION" | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+).*/\1/')

          # Pull lines from '## [BASE]' to (but not including) the next '## ['.
          # Build the regex inside awk's BEGIN so "\\[" yields a literal-[
          # in the compiled ERE. Inlining `## [$BASE]` directly gets
          # parsed as an ERE character class, not a literal, which is why
          # every prior release body silently fell back to `git log`.
          NOTES=$(awk -v base="$BASE" '
            BEGIN { ver = "^## \\[" base "\\]" }
            $0 ~ ver {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md || true)

          if [ -z "${NOTES// }" ]; then
            echo "::warning::No CHANGELOG entry for [$BASE]; falling back to git log"
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              NOTES=$(git log --pretty=format:'- %s (%h)' "${PREV_TAG}..HEAD")
            else
              NOTES="(initial release — no prior tag to diff against)"
            fi
          fi

          {
            echo "## Installation"
            echo
            echo '```bash'
            if [ "$IS_PRE" = "true" ]; then
              echo "# Pre-release ($PROFILE) — installed from PyPI as a PEP 440 pre-release."
              echo "# 'pip install data-product-forge' skips pre-releases by default."
              echo "# Use one of:"
              echo "pip install data-product-forge==$VERSION       # exact pin"
              echo "pip install --pre data-product-forge            # latest pre-release"
            else
              echo "pip install data-product-forge==$VERSION"
            fi
            echo '```'
            echo
            echo '### Provider extras'
            echo '```bash'
            echo 'pip install "data-product-forge[local]"      # DuckDB'
            echo 'pip install "data-product-forge[gcp]"        # Google Cloud'
            echo 'pip install "data-product-forge[snowflake]"  # Snowflake'
            echo 'pip install "data-product-forge[all]"        # Everything'
            echo '```'
            echo
            echo '### Verifying the release (Sigstore)'
            echo 'Every wheel ships with a Sigstore attestation and an SLSA build provenance.'
            echo 'To verify a downloaded wheel against this GitHub Actions release:'
            echo '```bash'
            echo 'pip install sigstore'
            echo 'pip download data-product-forge=='"$VERSION"' --no-deps -d ./dpf'
            echo "gh attestation verify ./dpf/*.whl --repo Agenticstiger/forge-cli"
            echo '```'
            echo
            echo "$NOTES"
          } > release-notes.md

      - name: Download SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: sbom

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3.0.1
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "FLUID Build ${{ needs.quality-gate.outputs.version }}"
          body_path: release-notes.md
          prerelease: ${{ needs.quality-gate.outputs.is_prerelease == 'true' }}
          files: |
            dist/*
            sbom.cdx.json

  # ──────────────────────────────────────────────────────────────
  # 5. Build and push Docker image to GHCR
  # ──────────────────────────────────────────────────────────────
  docker:
    name: Docker Image (GHCR)
    needs: [quality-gate, verify-testpypi]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Download wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker-meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9  # v6.1.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ needs.quality-gate.outputs.profile }}-latest
            type=raw,value=latest,enable=${{ needs.quality-gate.outputs.is_prerelease == 'false' }}

      # Build the image locally first so it can be vulnerability-scanned
      # before it is ever pushed. The gha layer cache makes the push
      # build below near-instant.
      - name: Build image for scanning (no push)
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: forge-cli:scan
          build-args: |
            PROFILE=${{ needs.quality-gate.outputs.profile }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Grype (Anchore) — scans the image for OS + library CVEs that
      # pip-audit cannot see (base-image packages). Pinned by version
      # and verified by SHA256 — no third-party GitHub Action.
      - name: Install Grype (pinned + checksum-verified)
        run: |
          GRYPE_VERSION=0.112.0
          GRYPE_SHA256=acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea
          curl -sSL -o grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tar.gz" | sha256sum -c -
          tar -xzf grype.tar.gz grype
          ./grype version

      - name: Scan image for HIGH/CRITICAL CVEs (gate)
        # Fails the release on a HIGH/CRITICAL finding that has a fix
        # available. `--only-fixed` excludes unpatched base-image CVEs
        # (a Debian slim base always carries some) so the gate stays
        # actionable rather than permanently red.
        run: ./grype forge-cli:scan --fail-on high --only-fixed

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            PROFILE=${{ needs.quality-gate.outputs.profile }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
