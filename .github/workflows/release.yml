# Release Pipeline — publish to PyPI (via TestPyPI), GHCR, GitHub Releases.
#
# Design principles (matching modern Python OSS like Ruff / HTTPX / Pydantic):
#
#   1. Trust the PR-time CI.
#      Branch protection on `main` requires `ci.yml` to pass before merge.
#      This workflow does NOT re-run lint / pytest / bandit — `quality-gate`
#      is a lightweight tag-shape + CI-green check (~10 s).
#
#   2. Every release is cryptographically signed.
#      `pypa/gh-action-pypi-publish` uploads each wheel with a Sigstore
#      attestation (`attestations: true`). `actions/attest-build-provenance`
#      attaches an in-toto SLSA build provenance to the wheel, the sdist and
#      the GHCR image; the wheel's and sdist's bundles are also attached to the
#      GitHub Release as `<file>.intoto.jsonl`. All use GitHub OIDC — no
#      long-lived secrets. Only jobs that run no code fetched at release time
#      hold the signing token: build and docker install the package's
#      dependencies, so attest and attest-image sign what they produced.
#
#   3. Release notes come from CHANGELOG.md, not git log.
#      The GitHub Release body is extracted from the matching `## [X.Y.Z]`
#      section of CHANGELOG.md; falls back to git log if the entry is
#      missing (warning, not failure).
#
# Triggers:
#   - Push a tag matching v*.*.* (e.g. v0.7.1, v0.7.1a1, v0.7.1b2)
#   - Manual workflow_dispatch with a tag input
#
# Promotion model (every release passes through TestPyPI first):
#
#   quality-gate
#       └─ build
#           └─ attest                        (SLSA provenance of wheel + sdist)
#               └─ publish-testpypi          (every tag; + Sigstore)
#                   └─ verify-testpypi       (install + smoke from TestPyPI)
#                       └─ publish-pypi      (every tag, stable and pre; + Sigstore)
#                           ├─ verify-pypi   (final smoke from real PyPI)
#                           ├─ docker        (only once PyPI accepted the upload)
#                           │   └─ attest-image  (SLSA provenance of the image)
#                           │       └─ verify-image
#                           └─ github-release    (notes from release-notes)
#                               └─ verify-release
#
# All tags (stable and pre-release) promote to PyPI after the TestPyPI
# install smoke passes. Pre-releases are PEP 440 pre-release versions
# (a / b / rc / .dev) so `pip install data-product-forge` skips them by
# default — only `pip install --pre` or an explicit `==X.Y.ZrcN` pin
# picks them up. The GHCR image and the GitHub Release follow PyPI: when
# PyPI refuses the upload, neither is published.
#
# Wheel version comes from the git tag via setuptools-scm — no static
# `version = "..."` literal in pyproject.toml to drift.
#
# TestPyPI outage: a manual run with `skip_testpypi: true` skips the TestPyPI
# upload and its install check and publishes straight to PyPI, so a release
# is not held hostage by a TestPyPI incident. The tag must already exist and
# its commit's ci.yml must be green, as for any release. Every job builds and
# publishes the tag's commit, never the branch the run was started from. The
# provenance, though, names the commit the run started from: the attestations
# are built from the run's OIDC claims. So start the run from the tag itself:
#
#   gh workflow run release.yml --ref vX.Y.Z -f tag=vX.Y.Z -f skip_testpypi=true
#
# A tag cut before this input existed (v0.19.0 and earlier) has no skip_testpypi
# in its own release.yml. It was once dispatched with --ref main, but main's
# release.yml installs its build tools from requirements/release-tools.txt, and
# a tag cut before that file existed does not have it. Such a tag is dispatched
# with --ref <tag> instead, which runs the tag's own release.yml (and so cannot
# skip TestPyPI). The same holds for a tag whose release-tools.txt has no build
# backend (v0.41.0 and earlier): main's build job runs `python -m build
# --no-isolation` and stops, before anything is signed, when the tag's lock
# lacks setuptools. The gate refuses a start ref that does not contain the
# tag's commit, and warns that the provenance names the start ref when it is
# not the tag.
#
# verify-pypi (install + smoke from real PyPI) still runs; it is the only
# index install check on that path.
#
# Dry run: a pull request that changes the release path (the paths under
# `pull_request:` below) runs this workflow with no tag, and the gate outputs
# publish=false. build, docker (the image build, its version check and the
# Grype gate) and release-notes run as they would for a release, the notes
# reading the newest tag's CHANGELOG section. attest, the TestPyPI and PyPI
# jobs, attest-image and github-release are skipped, and so are docker's login,
# metadata and push steps: nothing is uploaded, signed, pushed or announced,
# and no job that runs holds a signing token. To rehearse main as it is, open
# a pull request that touches one of those paths. Never dispatch this workflow
# to try it out: a manual run is a release.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # A dry run (see the header): a pull request that changes the release path
  # runs every job up to the point where it would upload, sign, push or
  # announce, and stops there.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - requirements/release-tools.in
      - requirements/release-tools.txt
      - requirements/release-image.in
      - requirements/release-image.txt
      - Dockerfile
      - .grype.yaml
      - pyproject.toml
      - MANIFEST.in
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release (e.g. v0.7.1, v0.7.1a1)"
        required: true
        type: string
      skip_testpypi:
        description: "TestPyPI outage only: skip the TestPyPI upload and install check, publish straight to PyPI"
        required: false
        type: boolean
        default: false

# Don't let two simultaneous tag pushes race PyPI uploads. A dry run has a group
# of its own per pull request, so it never queues behind or ahead of a release
# (a group keeps one pending run and cancels the one before it), and a newer
# push to the pull request cancels the dry run of the older one.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-dry-run-{0}', github.ref) || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}  # Job-level permissions only — least privilege

env:
  PACKAGE_NAME: data-product-forge
  PYTHON_VERSION: "3.12"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ──────────────────────────────────────────────────────────────
  # 1. Quality gate — tag-shape + CI-green check. No lint/test re-run.
  #
  # Branch protection on `main` already requires `ci.yml` to pass before
  # merge, so the commit we're tagging has been exercised end-to-end.
  # This gate just validates the tag shape and confirms the commit's
  # CI run concluded successfully. On a manual run it also checks that the
  # ref the run started from contains the tag's commit. ~10 seconds.
  # ──────────────────────────────────────────────────────────────
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read            # read the matching ci.yml run status
    outputs:
      publish: ${{ steps.meta.outputs.publish }}
      version: ${{ steps.meta.outputs.version }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      profile: ${{ steps.meta.outputs.profile }}
      tag: ${{ steps.meta.outputs.tag }}
      skip_testpypi: ${{ steps.meta.outputs.skip_testpypi }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Parse & validate tag shape
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          TAG_INPUT: ${{ github.event.inputs.tag || github.ref_name }}
          SKIP_TESTPYPI_INPUT: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_testpypi }}
        run: |
          # A pull request is a dry run: no tag, nothing published. It
          # rehearses a stable release.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            {
              echo "publish=false"
              echo "version="
              echo "is_prerelease=false"
              echo "profile=stable"
              echo "tag="
              echo "skip_testpypi=false"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::Dry run of the release: nothing is uploaded, signed, pushed or released."
            exit 0
          fi
          TAG="$TAG_INPUT"
          # Strict PEP 440 / semver-compatible shape with optional
          # pre-release suffix (a / b / rc / .dev).
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+|\.dev[0-9]+)?$ ]]; then
            echo "::error::Tag '$TAG' is not a valid vX.Y.Z[(a|b|rc)N|.devN] form"
            exit 1
          fi
          VERSION="${TAG#v}"
          if   [[ "$VERSION" == *a*    ]]; then PROFILE=alpha; PRE=true
          elif [[ "$VERSION" == *b*    ]]; then PROFILE=beta;  PRE=true
          elif [[ "$VERSION" == *rc*   ]]; then PROFILE=rc;    PRE=true
          elif [[ "$VERSION" == *.dev* ]]; then PROFILE=dev;   PRE=true
          else                                   PROFILE=stable; PRE=false
          fi
          # Only a manual run can skip TestPyPI; a tag push never does.
          SKIP=false
          if [ "$SKIP_TESTPYPI_INPUT" = "true" ]; then
            SKIP=true
            echo "::warning::skip_testpypi: ${GITHUB_ACTOR} skipped TestPyPI for $TAG. It is published straight to PyPI; verify-pypi is the only index install check."
          fi
          {
            echo "publish=true"
            echo "version=$VERSION"
            echo "is_prerelease=$PRE"
            echo "profile=$PROFILE"
            echo "tag=$TAG"
            echo "skip_testpypi=$SKIP"
          } >> "$GITHUB_OUTPUT"
          echo "Tag '$TAG' parsed as version='$VERSION' profile='$PROFILE' is_prerelease='$PRE' skip_testpypi='$SKIP'"

      - name: Assert tag points at a commit whose ci.yml is green
        id: commit
        if: steps.meta.outputs.publish == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        with:
          script: |
            // The commit being released is the tag's. A tag push runs on it; a
            // manual run may start from a branch (main), so resolve the tag.
            const tag = process.env.TAG;
            let sha = context.sha;
            if (context.eventName === "workflow_dispatch") {
              try {
                const { data: commit } = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `refs/tags/${tag}`,
                });
                sha = commit.sha;
              } catch (err) {
                core.setFailed(
                  `Could not resolve tag ${tag} to a commit: ${err.message}. ` +
                  `A manual run releases an existing tag: check it was pushed (git push origin ${tag}).`,
                );
                return;
              }
              if (sha !== context.sha) {
                // Provenance (the SLSA attestation and PyPI's Sigstore ones) is
                // built from the run's OIDC claims, so it names the ref and sha
                // the run started from, not the commit checked out. Refuse a
                // start ref that does not contain the tag's commit. A compare
                // error (404 for commits with no history in common) is refused.
                const { data: cmp } = await github.rest.repos.compareCommitsWithBasehead({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  basehead: `${sha}...${context.sha}`,
                  per_page: 1,
                }).catch((err) => ({ data: { status: `error: ${err.message}` } }));
                if (cmp.status !== "ahead" && cmp.status !== "identical") {
                  core.setFailed(
                    `Tag ${tag} (${sha}) is not an ancestor of ${context.ref} (${context.sha}): ` +
                    `compare status '${cmp.status}'. Dispatch with --ref ${tag}.`,
                  );
                  return;
                }
                core.warning(
                  `Provenance will name ${context.ref}@${context.sha}, not ${tag}@${sha}. ` +
                  `Dispatch with --ref ${tag} to make it name the tag.`,
                );
              }
            }
            const { data: runs } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "ci.yml",
              head_sha: sha,
              per_page: 1,
            });
            const latest = runs.workflow_runs[0];
            if (!latest) {
              core.setFailed(
                `No ci.yml run found for commit ${sha}. ` +
                `Did you tag a commit before its PR CI finished?`,
              );
              return;
            }
            if (latest.conclusion !== "success") {
              core.setFailed(
                `Latest ci.yml run on ${sha} concluded '${latest.conclusion}'. ` +
                `Refusing to release from a non-green commit. Run: ${latest.html_url}`,
              );
              return;
            }
            core.setOutput("sha", sha);
            core.notice(`ci.yml on ${sha}: ${latest.conclusion} (${latest.html_url})`);

  # ──────────────────────────────────────────────────────────────
  # 2. Build distribution artifacts
  # ──────────────────────────────────────────────────────────────
  build:
    name: Build Package
    needs: quality-gate
    runs-on: ubuntu-latest
    # Read-only. This job runs code from outside the repository's locks: the
    # smoke install below resolves the package's dependencies from PyPI and
    # runs the CLI. So it cannot ask for a signing token; the attest job signs.
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.digests.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The tag's commit, also on a manual run started from a branch.
          ref: ${{ needs.quality-gate.outputs.sha }}
          # setuptools-scm needs full history + all tags to derive the version.
          fetch-depth: 0

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Hash-locked: requirements/release-tools.in names pip, build, twine,
      # cyclonedx-bom and the build backend (setuptools, setuptools-scm, wheel),
      # and release-tools.txt carries every wheel hash. --require-hashes refuses
      # anything that is not in the file. The SBOM step below uses cyclonedx-bom
      # from the same file.
      - name: Install build tools (hash-locked)
        run: python -m pip install --require-hashes -r requirements/release-tools.txt

      # --no-isolation builds with the backend installed above. Without it, build
      # makes a fresh environment and installs pyproject.toml's [build-system]
      # requires from PyPI, unpinned and unhashed, on every release. build still
      # checks those requires against this environment and stops before building
      # when one is missing or out of bounds.
      - name: Build wheel and sdist
        env:
          FLUID_BUILD_PROFILE: ${{ needs.quality-gate.outputs.profile }}
        run: python -m build --no-isolation

      - name: Strict metadata check
        run: twine check --strict dist/*

      # Fails before anything is uploaded or signed if dist/ is not exactly one
      # wheel and one sdist, so each attest step matches one file.
      - name: Check dist/ holds one wheel and one sdist
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel and one sdist in dist/"
            ls -l dist
            exit 1
          fi

      # Taken before any step that runs code from outside this repository and
      # its locks, and the files are uploaded right after, before the smoke
      # install: the attest job signs only files with exactly these digests.
      - name: Record the distribution files' digests
        id: digests
        run: |
          set -euo pipefail
          cd dist
          sha256sum -- *.whl *.tar.gz
          echo "sha256=$(sha256sum -- *.whl *.tar.gz | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Isolated wheel install and verify
        run: |
          python -m venv /tmp/test-install
          /tmp/test-install/bin/pip install dist/*.whl

          # Verify import resolves from site-packages
          INSTALL_PATH=$(/tmp/test-install/bin/python -I -c "import fluid_build; print(fluid_build.__file__)")
          echo "Installed at: ${INSTALL_PATH}"
          if [[ "$INSTALL_PATH" != */site-packages/* ]]; then
            echo "::error::fluid_build resolved outside site-packages"
            exit 1
          fi

          # Verify critical runtime assets
          /tmp/test-install/bin/python -I -c "
          from pathlib import Path
          import fluid_build
          pkg = Path(fluid_build.__file__).parent
          assert (pkg / 'build-manifest.yaml').exists(), 'build-manifest.yaml missing'
          assert (pkg / 'templates' / 'hello-world' / 'contract.fluid.yaml').exists(), 'template missing'
          assert (pkg / 'schemas').is_dir(), 'schemas dir missing'
          print('All runtime assets verified')
          "

          # Verify CLI and version
          /tmp/test-install/bin/fluid --version

          # Functional scaffold check
          cd /tmp
          /tmp/test-install/bin/fluid init release-smoke --template hello-world
          test -f release-smoke/contract.fluid.yaml || { echo "::error::scaffold failed"; exit 1; }
          echo "Release smoke test passed"

      - name: Generate CycloneDX SBOM
        # SBOM of exactly what the released wheel installs (the isolated
        # venv built above). Shipped as a release artifact for supply-chain
        # transparency — what JFrog Xray / CRA-minded consumers expect.
        run: |
          cyclonedx-py environment /tmp/test-install \
            --of JSON --output-file sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # 2b. Sign the build provenance of the distribution files.
  #
  # A job of its own, the pattern slsa-github-generator follows: the job that
  # holds the signing token runs nothing but the steps below. The build job
  # runs the build backend, the package's dependencies and the SBOM tool, and
  # none of them can ask for a token that signs as this workflow. Nothing is
  # published unless this job succeeded.
  # ──────────────────────────────────────────────────────────────
  attest:
    name: Attest Build Provenance
    needs: [quality-gate, build]
    if: needs.quality-gate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write          # Sigstore / OIDC
      attestations: write      # SLSA build provenance
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      # Signs nothing unless dist/ is exactly one wheel and one sdist, each the
      # file the build job recorded before any step ran fetched code.
      - name: Check dist/ holds one wheel and one sdist
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::expected exactly one wheel and one sdist in dist/"
            ls -l dist
            exit 1
          fi

      # The artifact is only as trustworthy as the run's store: code fetched later in
      # this run (the TestPyPI smoke install, the image build) could replace it.
      # Anything this job uploads or installs is the file the build job recorded.
      - name: Check the files are the ones the build job made
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd dist
          printf '%s' "${SHA256}" | base64 -d | sha256sum --check --strict -
          # And nothing beside them: the steps below take everything in dist/.
          shopt -s dotglob nullglob
          files=(*)
          have="$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)"
          want="$(printf '%s' "${SHA256}" | base64 -d | awk '{ print $2 }' | LC_ALL=C sort)"
          if [ "${have}" != "${want}" ]; then
            echo "::error::dist/ holds files the build job did not make: ${have}"
            exit 1
          fi

      # One attestation per distribution file, so each file gets a bundle of its
      # own that can ride along with it as a release asset. Each is an in-toto
      # attestation proving the file was built by this workflow / this commit,
      # verifiable via `gh attestation verify`.
      - name: Attest build provenance of the wheel (SLSA)
        id: attest-wheel
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.whl"

      - name: Attest build provenance of the sdist (SLSA)
        id: attest-sdist
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.tar.gz"

      # The bundle is a Sigstore bundle holding the signed SLSA provenance. It is
      # named <file>.intoto.jsonl, the name OpenSSF Scorecard's Signed-Releases
      # check looks for among the release assets, and kept out of dist/ so the
      # PyPI upload sees only distribution files. Same approach as
      # pypa/virtualenv's release workflow.
      - name: Collect the provenance bundles
        env:
          WHEEL_BUNDLE: ${{ steps.attest-wheel.outputs.bundle-path }}
          SDIST_BUNDLE: ${{ steps.attest-sdist.outputs.bundle-path }}
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          mkdir provenance
          cp "${WHEEL_BUNDLE}" "provenance/$(basename "${wheels[0]}").intoto.jsonl"
          cp "${SDIST_BUNDLE}" "provenance/$(basename "${sdists[0]}").intoto.jsonl"
          ls -l provenance

      - name: Upload provenance bundles
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: provenance
          path: provenance/
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # 3a. Publish to TestPyPI — every release goes here first.
  # ──────────────────────────────────────────────────────────────
  publish-testpypi:
    name: Publish to TestPyPI
    needs: [quality-gate, build, attest]
    if: needs.quality-gate.outputs.publish == 'true' && needs.quality-gate.outputs.skip_testpypi != 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/data-product-forge
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      # The artifact is only as trustworthy as the run's store: code fetched later in
      # this run (the TestPyPI smoke install, the image build) could replace it.
      # Anything this job uploads or installs is the file the build job recorded.
      - name: Check the files are the ones the build job made
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd dist
          printf '%s' "${SHA256}" | base64 -d | sha256sum --check --strict -
          # And nothing beside them: the steps below take everything in dist/.
          shopt -s dotglob nullglob
          files=(*)
          have="$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)"
          want="$(printf '%s' "${SHA256}" | base64 -d | awk '{ print $2 }' | LC_ALL=C sort)"
          if [ "${have}" != "${want}" ]; then
            echo "::error::dist/ holds files the build job did not make: ${have}"
            exit 1
          fi

      - name: Publish to TestPyPI (with Sigstore attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  # ──────────────────────────────────────────────────────────────
  # 3a-verify. Install from TestPyPI and smoke-test the package.
  # Always runs; gates the PyPI promotion below.
  # ──────────────────────────────────────────────────────────────
  verify-testpypi:
    name: Verify TestPyPI Install
    needs: [quality-gate, publish-testpypi]
    if: needs.quality-gate.outputs.skip_testpypi != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Wait for TestPyPI index
        run: sleep 30

      - name: Install from TestPyPI
        env:
          VERSION: ${{ needs.quality-gate.outputs.version }}
        run: |
          python -m venv /tmp/testpypi-verify
          # TestPyPI's simple index can lag minutes behind the upload, so retry
          # with back-off instead of a single attempt. The publish itself is
          # already done — this only waits out index propagation (a single attempt
          # is what flaked the v0.10.0 / v0.10.1 releases).
          #
          # The package comes from TestPyPI alone, with no dependencies, and its
          # dependencies from PyPI alone: with both indexes in one resolution, a
          # name on TestPyPI that PyPI's real project owns would be taken from
          # whichever index has the higher version.
          ok=0
          for attempt in $(seq 1 12); do
            if /tmp/testpypi-verify/bin/pip install --no-deps \
                --index-url https://test.pypi.org/simple/ \
                "data-product-forge==${VERSION}"; then
              echo "Installed on attempt ${attempt}."
              ok=1
              break
            fi
            echo "::warning::TestPyPI attempt ${attempt}/12 failed (index not propagated yet?); retrying in 20s…"
            sleep 20
          done
          if [ "${ok}" -ne 1 ]; then
            echo "::error::data-product-forge==${VERSION} not installable from TestPyPI after 12 attempts (~4 min)."
            exit 1
          fi
          # The package is installed and satisfies the pin, so this adds what it
          # depends on, from PyPI only.
          /tmp/testpypi-verify/bin/pip install --index-url https://pypi.org/simple/ \
            "data-product-forge==${VERSION}"

      - name: Verify installed package
        run: |
          # Verify import and version
          /tmp/testpypi-verify/bin/python -I -c "
          import fluid_build
          assert fluid_build.__version__ == '${{ needs.quality-gate.outputs.version }}', \
              f'Version mismatch: {fluid_build.__version__}'
          print(f'Version OK: {fluid_build.__version__}')
          "

          # Verify runtime assets
          /tmp/testpypi-verify/bin/python -I -c "
          from pathlib import Path
          import fluid_build
          pkg = Path(fluid_build.__file__).parent
          assert (pkg / 'build-manifest.yaml').exists(), 'build-manifest.yaml missing from wheel'
          assert (pkg / 'templates' / 'hello-world' / 'contract.fluid.yaml').exists(), 'template missing from wheel'
          assert (pkg / 'schemas').is_dir(), 'schemas dir missing from wheel'
          print('All runtime assets present')
          "

          # Verify CLI
          /tmp/testpypi-verify/bin/fluid --version

          # Functional scaffold test
          cd /tmp
          /tmp/testpypi-verify/bin/fluid init testpypi-scaffold --template hello-world
          test -f testpypi-scaffold/contract.fluid.yaml || { echo '::error::scaffold failed'; exit 1; }
          echo "TestPyPI package verified successfully"

  # ──────────────────────────────────────────────────────────────
  # 3b. Publish to PyPI — every tag, gated by TestPyPI verify.
  # ──────────────────────────────────────────────────────────────
  publish-pypi:
    name: Publish to PyPI
    needs: [quality-gate, build, attest, verify-testpypi]
    # All tags promote to PyPI once the TestPyPI install smoke passes.
    # Pre-releases (rc/b/a/dev) are PEP 440 pre-release versions; PyPI
    # treats them as such, and `pip install` skips them by default
    # (only `pip install --pre` or `==X.Y.ZrcN` opts in).
    # Normally gated on the TestPyPI install check. On the outage path
    # (skip_testpypi) that job is skipped on purpose, so the condition names
    # it explicitly: GitHub skips a job whose needs were skipped unless its
    # `if` calls a status function, here !cancelled().
    if: >-
      ${{ !cancelled()
      && needs.quality-gate.result == 'success'
      && needs.quality-gate.outputs.publish == 'true'
      && needs.build.result == 'success'
      && needs.attest.result == 'success'
      && (needs.verify-testpypi.result == 'success'
      || (needs.verify-testpypi.result == 'skipped' && needs.quality-gate.outputs.skip_testpypi == 'true')) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
    environment:
      name: pypi
      url: https://pypi.org/p/data-product-forge
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      # The artifact is only as trustworthy as the run's store: code fetched later in
      # this run (the TestPyPI smoke install, the image build) could replace it.
      # Anything this job uploads or installs is the file the build job recorded.
      - name: Check the files are the ones the build job made
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd dist
          printf '%s' "${SHA256}" | base64 -d | sha256sum --check --strict -
          # And nothing beside them: the steps below take everything in dist/.
          shopt -s dotglob nullglob
          files=(*)
          have="$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)"
          want="$(printf '%s' "${SHA256}" | base64 -d | awk '{ print $2 }' | LC_ALL=C sort)"
          if [ "${have}" != "${want}" ]; then
            echo "::error::dist/ holds files the build job did not make: ${have}"
            exit 1
          fi

      - name: Publish to PyPI (with Sigstore attestations)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          attestations: true

  # ──────────────────────────────────────────────────────────────
  # 3b-verify. Install from PyPI and smoke-test (final gate).
  # ──────────────────────────────────────────────────────────────
  verify-pypi:
    name: Verify PyPI Install
    needs: [quality-gate, publish-pypi]
    # Explicit: the implicit success() is false when any ancestor was skipped,
    # and on the outage path the TestPyPI jobs are.
    if: ${{ !cancelled() && needs.quality-gate.result == 'success' && needs.publish-pypi.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Wait for PyPI index
        run: sleep 30

      - name: Install from PyPI
        run: |
          python -m venv /tmp/pypi-verify
          # PyPI's index can also briefly lag the publish; retry with back-off so
          # the (already-successful) release isn't failed by a propagation race.
          ok=0
          for attempt in $(seq 1 12); do
            if /tmp/pypi-verify/bin/pip install \
                "data-product-forge==${{ needs.quality-gate.outputs.version }}"; then
              echo "Installed on attempt ${attempt}."
              ok=1
              break
            fi
            echo "::warning::PyPI attempt ${attempt}/12 failed (index not propagated yet?); retrying in 20s…"
            sleep 20
          done
          if [ "${ok}" -ne 1 ]; then
            echo "::error::data-product-forge==${{ needs.quality-gate.outputs.version }} not installable from PyPI after 12 attempts (~4 min)."
            exit 1
          fi

      - name: Verify installed package
        run: |
          /tmp/pypi-verify/bin/python -I -c "
          import fluid_build
          assert fluid_build.__version__ == '${{ needs.quality-gate.outputs.version }}', \
              f'Version mismatch: {fluid_build.__version__}'
          print(f'Version OK: {fluid_build.__version__}')
          "
          /tmp/pypi-verify/bin/fluid --version
          cd /tmp
          /tmp/pypi-verify/bin/fluid init pypi-verify-scaffold --template hello-world
          test -f pypi-verify-scaffold/contract.fluid.yaml || { echo '::error::scaffold failed'; exit 1; }
          echo "PyPI package verified successfully"

  # ──────────────────────────────────────────────────────────────
  # 4a. Release notes from CHANGELOG.md. Read-only, so a dry run runs it;
  #     github-release posts what it wrote.
  # ──────────────────────────────────────────────────────────────
  release-notes:
    name: Release Notes
    needs: quality-gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.quality-gate.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Generate release notes from CHANGELOG.md
        # Extracts the '## [X.Y.Z] — date' section body from CHANGELOG.md.
        # Pre-release suffixes are stripped for lookup: v0.7.11a1 reads the
        # [0.7.11] section. If no matching section exists, falls back to a
        # git log since the previous tag (emitted as a workflow warning).
        # A dry run reads the newest tag's section instead and fails if it is
        # not found.
        env:
          PUBLISH: ${{ needs.quality-gate.outputs.publish }}
          VERSION: ${{ needs.quality-gate.outputs.version }}
          PROFILE: ${{ needs.quality-gate.outputs.profile }}
          IS_PRE: ${{ needs.quality-gate.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          if [ "$PUBLISH" != "true" ]; then
            # A dry run has no tag: read the section of the newest release tag
            # this commit contains. That section exists, so it must be found.
            # Pre-release tags are skipped: a real run of one may fall back to
            # git log, so its section need not exist.
            VERSION=$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude 'v*[a-z]*' HEAD)
            VERSION="${VERSION#v}"
          fi

          # Strip pre-release suffix for CHANGELOG lookup.
          BASE=$(echo "$VERSION" | sed -E 's/([0-9]+\.[0-9]+\.[0-9]+).*/\1/')

          # Pull lines from '## [BASE]' to (but not including) the next '## ['.
          # Build the regex inside awk's BEGIN so "\\[" yields a literal-[
          # in the compiled ERE. Inlining `## [$BASE]` directly gets
          # parsed as an ERE character class, not a literal, which is why
          # every prior release body silently fell back to `git log`.
          NOTES=$(awk -v base="$BASE" '
            BEGIN { ver = "^## \\[" base "\\]" }
            $0 ~ ver {flag=1; next}
            /^## \[/ && flag {exit}
            flag {print}
          ' CHANGELOG.md || true)

          if [ -z "${NOTES// }" ]; then
            if [ "$PUBLISH" != "true" ]; then
              echo "::error::No CHANGELOG section found for [$BASE], the newest tag's version: the notes extractor is broken"
              exit 1
            fi
            echo "::warning::No CHANGELOG entry for [$BASE]; falling back to git log"
            PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              NOTES=$(git log --pretty=format:'- %s (%h)' "${PREV_TAG}..HEAD")
            else
              NOTES="(initial release — no prior tag to diff against)"
            fi
          fi

          {
            echo "## Installation"
            echo
            echo '```bash'
            if [ "$IS_PRE" = "true" ]; then
              echo "# Pre-release ($PROFILE) — installed from PyPI as a PEP 440 pre-release."
              echo "# 'pip install data-product-forge' skips pre-releases by default."
              echo "# Use one of:"
              echo "pip install data-product-forge==$VERSION       # exact pin"
              echo "pip install --pre data-product-forge            # latest pre-release"
            else
              echo "pip install data-product-forge==$VERSION"
            fi
            echo '```'
            echo
            echo '### Provider extras'
            echo '```bash'
            echo 'pip install "data-product-forge[local]"      # DuckDB'
            echo 'pip install "data-product-forge[gcp]"        # Google Cloud'
            echo 'pip install "data-product-forge[snowflake]"  # Snowflake'
            echo 'pip install "data-product-forge[all]"        # Everything'
            echo '```'
            echo
            echo '### Verifying the release (Sigstore)'
            echo 'Every wheel ships with a Sigstore attestation and an SLSA build provenance.'
            echo 'To verify a downloaded wheel against this GitHub Actions release:'
            echo '```bash'
            echo 'pip install sigstore'
            echo 'pip download data-product-forge=='"$VERSION"' --no-deps -d ./dpf'
            echo "gh attestation verify ./dpf/*.whl --repo Agenticstiger/forge-cli"
            echo '```'
            echo
            echo 'Each distribution file below has its provenance beside it, in a file'
            echo 'named after it with the suffix .intoto.jsonl. To verify a downloaded file:'
            echo '```bash'
            echo 'gh attestation verify <file> --repo Agenticstiger/forge-cli --bundle <file>.intoto.jsonl'
            echo '```'
            echo
            echo "$NOTES"
          } > release-notes.md

          if [ "$PUBLISH" != "true" ]; then
            {
              echo "## Release notes a release of $VERSION would carry (dry run)"
              echo
              cat release-notes.md
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error
          retention-days: 30

  # ──────────────────────────────────────────────────────────────
  # 4b. GitHub Release with changelog and artifacts (after PyPI accepted it).
  # ──────────────────────────────────────────────────────────────
  github-release:
    name: GitHub Release
    needs: [quality-gate, build, publish-pypi, release-notes]
    # Announces only what PyPI accepted: a rejected upload (for example "file
    # already exists" on a re-dispatched tag) must not cut a release.
    # publish-pypi's own condition already requires the TestPyPI install check,
    # or the outage path. The status functions are spelled out because the
    # implicit success() is false when any ancestor was skipped, and on the
    # outage path the TestPyPI jobs are.
    if: >-
      ${{ !cancelled()
      && needs.quality-gate.result == 'success'
      && needs.quality-gate.outputs.publish == 'true'
      && needs.build.result == 'success'
      && needs.publish-pypi.result == 'success'
      && needs.release-notes.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      # The artifact is only as trustworthy as the run's store: code fetched later in
      # this run (the TestPyPI smoke install, the image build) could replace it.
      # Anything this job uploads or installs is the file the build job recorded.
      - name: Check the files are the ones the build job made
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd dist
          printf '%s' "${SHA256}" | base64 -d | sha256sum --check --strict -
          # And nothing beside them: the steps below take everything in dist/.
          shopt -s dotglob nullglob
          files=(*)
          have="$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)"
          want="$(printf '%s' "${SHA256}" | base64 -d | awk '{ print $2 }' | LC_ALL=C sort)"
          if [ "${have}" != "${want}" ]; then
            echo "::error::dist/ holds files the build job did not make: ${have}"
            exit 1
          fi

      - name: Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-notes

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sbom

      - name: Download provenance bundles
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: provenance
          path: provenance/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          tag_name: ${{ needs.quality-gate.outputs.tag }}
          name: "FLUID Build ${{ needs.quality-gate.outputs.version }}"
          body_path: release-notes.md
          prerelease: ${{ needs.quality-gate.outputs.is_prerelease == 'true' }}
          files: |
            dist/*
            provenance/*.intoto.jsonl
            sbom.cdx.json

  # ──────────────────────────────────────────────────────────────
  # 5. Build and push Docker image to GHCR (after PyPI accepted it)
  # ──────────────────────────────────────────────────────────────
  docker:
    name: Docker Image (GHCR)
    needs: [quality-gate, build, publish-pypi]
    # Moves the GHCR X.Y.Z, X.Y, <profile>-latest and latest tags only for a
    # version PyPI accepted. Gated like github-release, for the same reasons.
    # A dry run builds, checks and scans the image, and pushes nothing.
    if: >-
      ${{ !cancelled()
      && needs.quality-gate.result == 'success'
      && needs.build.result == 'success'
      && (needs.publish-pypi.result == 'success' || needs.quality-gate.outputs.publish == 'false') }}
    runs-on: ubuntu-latest
    # No signing token here: this job runs code from outside the repository's
    # locks (the image build installs the package's dependencies, and the
    # check below runs the image). attest-image signs what it pushed.
    permissions:
      contents: read
      packages: write          # push the image to GHCR
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      tags: ${{ steps.docker-meta.outputs.tags }}
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.quality-gate.outputs.sha }}
          persist-credentials: false

      # Into the build context: the Dockerfile installs this wheel, the file the
      # build job made and PyPI serves, instead of building the source tree.
      - name: Download wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      # The artifact is only as trustworthy as the run's store: code fetched later in
      # this run (the TestPyPI smoke install, the image build) could replace it.
      # Anything this job uploads or installs is the file the build job recorded.
      - name: Check the files are the ones the build job made
        env:
          SHA256: ${{ needs.build.outputs.sha256 }}
        run: |
          set -euo pipefail
          cd dist
          printf '%s' "${SHA256}" | base64 -d | sha256sum --check --strict -
          # And nothing beside them: the steps below take everything in dist/.
          shopt -s dotglob nullglob
          files=(*)
          have="$(printf '%s\n' "${files[@]}" | LC_ALL=C sort)"
          want="$(printf '%s' "${SHA256}" | base64 -d | awk '{ print $2 }' | LC_ALL=C sort)"
          if [ "${have}" != "${want}" ]; then
            echo "::error::dist/ holds files the build job did not make: ${have}"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        if: needs.quality-gate.outputs.publish == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: docker-meta
        if: needs.quality-gate.outputs.publish == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The tag is named, not read from the event, so a manual run started
          # from main tags the image too; the revision label is the tag's commit.
          tags: |
            type=semver,pattern={{version}},value=${{ needs.quality-gate.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.quality-gate.outputs.tag }}
            type=raw,value=${{ needs.quality-gate.outputs.profile }}-latest
            type=raw,value=latest,enable=${{ needs.quality-gate.outputs.is_prerelease == 'false' }}
          labels: |
            org.opencontainers.image.revision=${{ needs.quality-gate.outputs.sha }}

      # Build the image locally first so it can be vulnerability-scanned
      # before it is ever pushed. The gha layer cache makes the push
      # build below near-instant.
      - name: Build image for scanning (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: forge-cli:scan
          build-args: |
            PROFILE=${{ needs.quality-gate.outputs.profile }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The Dockerfile installs the wheel from dist/, the one the build job made.
      # An image that reports another version is not this release: built from
      # the source tree, as before, it reported 0.0.0+unknown.
      - name: Check the scanned image holds this release's wheel
        env:
          PUBLISH: ${{ needs.quality-gate.outputs.publish }}
          VERSION: ${{ needs.quality-gate.outputs.version }}
        run: |
          set -euo pipefail
          if [ "${PUBLISH}" != "true" ]; then
            # A dry run has no tag: the version is the one the wheel was given.
            wheels=(dist/*.whl)
            VERSION="$(basename "${wheels[0]}" .whl)"
            VERSION="${VERSION#*-}"
            VERSION="${VERSION%%-*}"
          fi
          got=$(docker run --rm --entrypoint python forge-cli:scan -I -c \
            'import fluid_build; print(fluid_build.__version__)')
          if [ "${got}" != "${VERSION}" ]; then
            echo "::error::the image's fluid_build is version '${got}', not ${VERSION}"
            exit 1
          fi
          echo "The image holds data-product-forge ${got}."

      # Grype (Anchore) — scans the image for OS + library CVEs that
      # pip-audit cannot see (base-image packages). Pinned by version
      # and verified by SHA256 — no third-party GitHub Action.
      - name: Install Grype (pinned + checksum-verified)
        run: |
          GRYPE_VERSION=0.112.0
          GRYPE_SHA256=acb14a030010fe9bdb9594b4ae108d9d14ef2f926d936aa0916dc62c89c058ea
          curl -sSL -o grype.tar.gz \
            "https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}/grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          echo "${GRYPE_SHA256}  grype.tar.gz" | sha256sum -c -
          tar -xzf grype.tar.gz grype
          ./grype version

      - name: Scan image for HIGH/CRITICAL CVEs (gate)
        # Fails the release on a HIGH/CRITICAL finding that has a fix
        # available. `--only-fixed` excludes unpatched base-image CVEs
        # (a Debian slim base always carries some) so the gate stays
        # actionable rather than permanently red.
        run: ./grype forge-cli:scan --fail-on high --only-fixed

      - name: Build and push Docker image
        id: push
        if: needs.quality-gate.outputs.publish == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.docker-meta.outputs.tags }}
          labels: ${{ steps.docker-meta.outputs.labels }}
          build-args: |
            PROFILE=${{ needs.quality-gate.outputs.profile }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The push is a second build, so the check above saw the image built for
      # scanning, not this one. Ask the pushed digest what it holds; a mismatch
      # fails the job before attest-image signs it.
      - name: Check the pushed image holds this release's wheel
        if: needs.quality-gate.outputs.publish == 'true'
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ needs.quality-gate.outputs.version }}
        run: |
          set -euo pipefail
          case "${DIGEST}" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "::error::the push gave no image digest"; exit 1 ;;
          esac
          image="$(printf '%s' "${IMAGE}" | tr '[:upper:]' '[:lower:]')@${DIGEST}"
          got=$(docker run --rm --entrypoint python "${image}" -I -c \
            'import fluid_build; print(fluid_build.__version__)')
          if [ "${got}" != "${VERSION}" ]; then
            echo "::error::the pushed image ${DIGEST} holds fluid_build ${got}, not ${VERSION}"
            exit 1
          fi
          echo "The pushed image ${DIGEST} holds data-product-forge ${got}."

  # ──────────────────────────────────────────────────────────────
  # 5b. Sign the build provenance of the pushed image, apart from the job that
  #     built it, as the attest job does for the distribution files.
  # ──────────────────────────────────────────────────────────────
  attest-image:
    name: Attest Image Provenance
    needs: [quality-gate, docker]
    # Explicit: on the outage path the TestPyPI jobs, ancestors through docker,
    # are skipped, and the implicit success() is then false.
    if: ${{ !cancelled() && needs.docker.result == 'success' && needs.quality-gate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      packages: write          # store the attestation in GHCR beside the image
      id-token: write          # Sigstore / OIDC
      attestations: write      # SLSA build provenance
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      # The attestation subject is the registry name in lowercase, which is how
      # GHCR stores it, while github.repository keeps the owner's capitals.
      - name: Name the image for attestation
        id: image
        env:
          REGISTRY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: echo "name=${REGISTRY_IMAGE,,}" >> "${GITHUB_OUTPUT}"

      # push-to-registry writes the attestation to GHCR with this login.
      - name: Log in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Signs a SLSA build provenance for the pushed image's digest with the
      # run's OIDC identity and stores it in GHCR beside the image, so
      #   gh attestation verify oci://ghcr.io/agenticstiger/forge-cli:<tag> \
      #     -R Agenticstiger/forge-cli
      # passes for every tag the push moved (they all name this digest).
      # create-storage-record is off: it needs `artifact-metadata: write` and
      # is not read by `gh attestation verify`.
      - name: Attest image build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ needs.docker.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

  # ──────────────────────────────────────────────────────────────
  # 6. Verify what was published, as a user would. Every check also pins what
  #    signed: this workflow, from the ref and commit this run started from
  #    (what the provenance records), on a GitHub-hosted runner. Read-only.
  # ──────────────────────────────────────────────────────────────
  # 6a. Each file on the GitHub Release, with its .intoto.jsonl bundle and
  #     with GitHub's attestation store.
  verify-release:
    name: Verify Release Provenance
    needs: [quality-gate, github-release]
    if: >-
      ${{ !cancelled()
      && needs.quality-gate.result == 'success'
      && needs.quality-gate.outputs.publish == 'true'
      && needs.github-release.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read           # download the GitHub Release's files
      attestations: read       # read the attestations GitHub stores
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify the release files and their provenance bundles
        env:
          TAG: ${{ needs.quality-gate.outputs.tag }}
        run: |
          set -euo pipefail
          policy=(
            --repo "${GITHUB_REPOSITORY}"
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
            --source-ref "${GITHUB_REF}"
            --source-digest "${GITHUB_SHA}"
            --deny-self-hosted-runners
            --predicate-type https://slsa.dev/provenance/v1
          )
          mkdir release-files
          gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --dir release-files
          cd release-files
          shopt -s nullglob
          wheels=(*.whl)
          sdists=(*.tar.gz)
          if [ "${#wheels[@]}" -ne 1 ] || [ "${#sdists[@]}" -ne 1 ]; then
            echo "::error::release ${TAG} does not hold exactly one wheel and one sdist"
            ls -l
            exit 1
          fi
          for file in "${wheels[0]}" "${sdists[0]}"; do
            if [ ! -f "${file}.intoto.jsonl" ]; then
              echo "::error::release ${TAG} has no ${file}.intoto.jsonl beside ${file}"
              exit 1
            fi
            gh attestation verify "${file}" --bundle "${file}.intoto.jsonl" "${policy[@]}"
            gh attestation verify "${file}" "${policy[@]}"
            echo "${file}: provenance verified, from its bundle and from the attestation store"
          done

  # 6b. Every GHCR tag the push moved, which must resolve to the digest this
  #     run pushed, and the attestation stored in GHCR beside it.
  verify-image:
    name: Verify Image Provenance
    needs: [quality-gate, docker, attest-image]
    if: >-
      ${{ !cancelled()
      && needs.quality-gate.result == 'success'
      && needs.quality-gate.outputs.publish == 'true'
      && needs.attest-image.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read       # read the attestations GitHub stores
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Verify every image tag the push moved
        env:
          DIGEST: ${{ needs.docker.outputs.digest }}
          TAGS: ${{ needs.docker.outputs.tags }}
        run: |
          set -euo pipefail
          policy=(
            --repo "${GITHUB_REPOSITORY}"
            --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/release.yml"
            --source-ref "${GITHUB_REF}"
            --source-digest "${GITHUB_SHA}"
            --deny-self-hosted-runners
            --predicate-type https://slsa.dev/provenance/v1
          )
          refs=()
          while IFS= read -r ref; do
            if [ -n "${ref}" ]; then refs+=("${ref}"); fi
          done <<< "${TAGS}"
          if [ "${#refs[@]}" -eq 0 ] || [ -z "${DIGEST}" ]; then
            echo "::error::the docker job reported no pushed tags or digest"
            exit 1
          fi
          for ref in "${refs[@]}"; do
            # The subject is the digest the tag resolves to now: it must be the
            # one this run pushed.
            got=$(gh attestation verify "oci://${ref}" "${policy[@]}" --format json \
              | jq -r '.[0].verificationResult.statement.subject[0].digest.sha256')
            if [ "sha256:${got}" != "${DIGEST}" ]; then
              echo "::error::${ref} resolves to sha256:${got}, not ${DIGEST}, the digest this run pushed"
              exit 1
            fi
            echo "${ref}: ${DIGEST}, provenance verified"
          done
          # The attestation attest-image stored in GHCR beside the image.
          gh attestation verify "oci://${refs[0]}" --bundle-from-oci "${policy[@]}"
