# CodeQL — first-party dataflow SAST (GitHub Advanced Security).
#
# This is CodeQL "advanced setup": a committed, reviewable workflow that
# runs on the very next PR — no reliance on a maintainer flipping the
# repo-Settings "default setup" toggle. Do NOT also enable default setup;
# GitHub rejects having both configured at once.
#
# Division of labour:
#   * CodeQL (here)        — generic vulnerability classes: injection,
#                            SQL-injection taint tracking, unsafe
#                            deserialization, path traversal.
#   * .semgrep/fluid-rules — forge-cli's own structural invariants.
#   * pip-audit + Grype + dependency-review — supply-chain CVEs.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly — catches newly-published CodeQL queries against unchanged code.
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload CodeQL results to code scanning
      actions: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7fc1baf373eb073c686865bd453d412d506a05a2  # v3.35.1
        with:
          languages: python
          # security-extended widens coverage beyond the default suite.
          queries: security-extended

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7fc1baf373eb073c686865bd453d412d506a05a2  # v3.35.1
        with:
          category: "/language:python"
