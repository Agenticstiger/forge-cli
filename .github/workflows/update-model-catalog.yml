name: Update LLM Model Catalog

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC
  workflow_dispatch: {}  # Manual trigger via GitHub UI

# `contents: write` to push the proposal branch, and nothing else.
#
# `pull-requests: write` used to be here for peter-evans/create-pull-request.
# It never worked: this repository has `can_approve_pull_request_reviews:
# false`, so every run ended with
#
#     GitHub Actions is not permitted to create or approve pull requests.
#
# and the job had never once succeeded. The choice was to enable that setting
# repository-wide or to stop needing it. This takes the second: the job pushes
# a branch and a human opens the pull request, so Actions is never granted
# rights to create one.
permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx

      # No API key. OpenRouter's model endpoint is public; the script explains
      # why the source moved off Artificial Analysis's own API.
      - name: Fetch latest model data
        run: python scripts/update_model_catalog.py

      - name: Check for catalog changes
        id: diff
        run: |
          git diff --quiet fluid_build/cli/llm_models.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      # Push a proposal branch; a human opens the pull request from it.
      #
      # Deliberately not create-pull-request. That needs Actions to hold
      # PR-creation rights repository-wide, which is a broad grant to buy one
      # weekly chore — and the model choice wants a human look anyway: the
      # script ranks on score and price, which cannot tell that a
      # highest-scoring model shipped yesterday and nobody has run it in anger.
      #
      # force-push because the branch IS the current proposal, not a history.
      # Last Monday's superseded suggestion is not worth preserving, and
      # nothing else writes here.
      - name: Push the proposed catalog to a branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fluid_build/cli/llm_models.json
          git commit -m 'chore: update LLM model catalog from OpenRouter'
          git push --force origin HEAD:refs/heads/auto/update-model-catalog
          {
            echo "### Model catalog changed"
            echo
            echo "Pushed to \`auto/update-model-catalog\`."
            echo
            echo "[Open a pull request](${{ github.server_url }}/${{ github.repository }}/compare/main...auto/update-model-catalog?expand=1)"
            echo
            echo "Review before merging: the script picks by intelligence score and price,"
            echo "which cannot judge whether a newly-topping model is production-ready."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Catalog changed — pushed to auto/update-model-catalog. Open a PR from it to land the change."

      - name: Report no change
        if: steps.diff.outputs.changed != 'true'
        run: echo "::notice::Model catalog is unchanged — nothing to propose."
