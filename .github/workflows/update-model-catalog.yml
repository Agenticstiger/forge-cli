name: Update LLM Model Catalog

on:
  schedule:
    - cron: '0 6 * * 1'  # Every Monday at 6am UTC
  workflow_dispatch: {}  # Manual trigger via GitHub UI

permissions:
  contents: write
  pull-requests: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install httpx

      - name: Fetch latest model data
        run: python scripts/update_model_catalog.py
        env:
          ARTIFICIAL_ANALYSIS_API_KEY: ${{ secrets.ARTIFICIAL_ANALYSIS_API_KEY }}

      - name: Check for catalog changes
        id: diff
        run: |
          git diff --quiet fluid_build/cli/llm_models.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create PR if catalog changed
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          title: 'chore: update LLM model catalog from Artificial Analysis'
          body: |
            Auto-generated by `scripts/update_model_catalog.py` from
            [Artificial Analysis](https://artificialanalysis.ai) API data.

            This PR updates the flagship, balanced, and routing model
            selections based on the latest intelligence scores and pricing.

            **Please review the diff before merging** — the script picks
            models by score, but human judgment is needed for edge cases
            (e.g., a new model that's technically highest-scored but
            hasn't been production-tested yet).
          branch: auto/update-model-catalog
          commit-message: 'chore: update LLM model catalog from Artificial Analysis'
          labels: |
            dependencies
            automated
