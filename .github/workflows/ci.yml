name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff "black==24.10.0"
      - name: Ruff check
        run: ruff check fluid_build/ tests/
      - name: Dead-code gate for staged forge modules
        run: |
          ruff check fluid_build/copilot fluid_build/forge_datamodel \
            --isolated \
            --select F401,F841,F811,B007 \
            --target-version py310 \
            --line-length 100
      - name: Black check
        run: black --check fluid_build/ tests/
      # detect-secrets was configured in .pre-commit-config.yaml but NOTHING
      # ran pre-commit in CI, so the gate only fired for contributors who had
      # installed the hooks locally. Any commit pushed without them — an agent
      # committing in a fresh worktree, a web edit, a rebase on a new machine —
      # bypassed it silently.
      #
      # Scoped to the files this PR TOUCHES, deliberately. `.secrets.baseline`
      # predates a fair amount of the tree, so a whole-repo run fails on
      # pre-existing lines (scanner-config regexes, a CHANGELOG example URL)
      # and would block every PR regardless of its content — a gate that
      # blocks everything gets deleted, not fixed. Catching what a change
      # ADDS is the job; auditing history is a separate, deliberate exercise.
      - name: Secret scan (detect-secrets on changed files)
        run: |
          pip install "detect-secrets==1.5.0"
          CHANGED=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref || 'main' }}...HEAD)
          if [ -z "$CHANGED" ]; then echo "no changed files"; exit 0; fi
          echo "$CHANGED"
          detect-secrets-hook --baseline .secrets.baseline $CHANGED

  # ── import-linter — architecture / cycle gate ───────────────────────
  # Runs the declarative contracts under ``[tool.importlinter]`` in
  # pyproject.toml. Today's contracts:
  #   1. ``observability must not depend on build_runners`` — pins the
  #      structural fix that broke the cli↔observability↔build_runners
  #      cycle that previously made ``cli/__init__.py`` un-importable
  #      under ``pytest --collect-only``.
  #   2. ``fluid_build._net is tier-0`` — guards the leaf module that
  #      now owns the canonical SSRF gate from re-acquiring an upward
  #      edge into the fluid_build package tree.
  #
  # Needs the project installed (the linter walks the in-venv import
  # graph) so this job is separate from the ruff/black ``lint`` job
  # above. Cheap (≤30s) — kept as its own job for clean failure surfaces.
  import-hygiene:
    name: Import hygiene (import-linter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project (dev extras pull import-linter)
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run import-linter contracts
        run: lint-imports

  # ── mypy --strict on the security-critical hotspot allowlist ─────────
  # Incremental strict-typing gate. The allowlist lives in ONE place — the
  # ``[[tool.mypy.overrides]] strict = true`` block in pyproject.toml — and
  # ``scripts/mypy_strict.py`` (shared with ``make typecheck-strict``) derives
  # its target file list straight from there, so the config and the gate can
  # never drift. The runner uses ``--follow-imports=silent`` to scope the
  # check to exactly those modules, so strict errors in the still-loose rest
  # of the tree never fail this gate. Deliberately lightweight (mypy + stubs
  # only, no project install) so it stays fast.
  typecheck-strict:
    name: Type check (mypy --strict, hotspots)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install "mypy>=1.10" types-PyYAML
      - name: mypy --strict on hotspot allowlist (derived from pyproject.toml)
        run: python scripts/mypy_strict.py

  # ── Test matrix — plain suite, every Python version ─────────────────
  # Every leg (including 3.12) runs the SAME ~5-min non-coverage suite.
  # The coverage run + coverage gates + Codecov upload used to be
  # `if: matrix.python-version == '3.12'` steps inside this matrix, which
  # made the 3.12 leg alone take ~20 min vs ~5 for every other leg — and
  # that overloaded leg was disproportionately killed by runner-infra
  # cancellations, costing a full matrix re-run each time. That work now
  # lives in the parallel `coverage-and-audit` job below, so the matrix
  # legs are uniform and the heavy coverage work runs concurrently.
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # The plain keyless suite runs in ~5 min per leg; 25 bounds a true
    # hang (a leaked server loop / deadlocked async session) to minutes
    # instead of GitHub's 6-hour default. A hung job that burns 6h of
    # runner time before anyone notices is how the 3.13/3.14 deadlock
    # stayed costly.
    timeout-minutes: 25
    env:
      # Cap glibc malloc arenas. On Linux glibc creates up to one ~64MB
      # virtual arena PER THREAD; a thread-heavy run balloons VIRTUAL
      # memory into multi-GB and gets OOM-killed at low RSS. Capping to 2
      # keeps virtual memory flat regardless of thread count — a standard
      # containerized-Python setting, and a backstop behind the real
      # thread-leak fixes + xdist per-worker isolation.
      MALLOC_ARENA_MAX: "2"
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,local]" || pip install -e ".[dev]"

      # ── Tests (all Python versions, no coverage) ────────────────
      - name: Run tests
        run: |
          python -m pytest \
            -n auto --dist loadscope \
            --ignore=tests/perf \
            --junitxml=junit.xml \
            -q

      # ── Perf budgets (serial — must NOT run under xdist) ────────
      # Wall-clock budgets (e.g. `fluid --help` < 2s) are meaningless
      # under `-n auto`: N workers contend for CPU and inflate subprocess
      # timings past budget (3.10 saw 2.275s vs the 2.0s gate). Run the
      # perf suite serially in its own step so the gate stays accurate
      # and reliable — this is how it passed before the suite went
      # parallel. ``tests/perf`` is excluded from the parallel run above
      # via ``--ignore=tests/perf``.
      - name: Perf budgets (serial)
        run: python -m pytest tests/perf -q -p no:randomly

      # ── Artifacts ───────────────────────────────────────────────
      # Per-version artifact names are load-bearing (downstream tooling
      # fetches test-results-py<ver>); coverage.xml now ships from the
      # `coverage-and-audit` job's own artifact instead.
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: test-results-py${{ matrix.python-version }}
          path: junit.xml
          retention-days: 14

  # ── Coverage & audit — the heavy leg, run once in parallel ──────────
  # Lift-and-shift of everything that used to be gated on
  # `matrix.python-version == '3.12'` inside the test matrix: the
  # coverage pytest run, the four coverage gates + informational total,
  # and the Codecov upload. Splitting it out keeps every matrix leg at
  # the same ~5-min profile (uniform legs are far less likely to be
  # singled out by runner-infra SIGTERM cancellations) while this job
  # runs concurrently, so overall PR wall-clock does not regress.
  # Step order, commands, env, and Codecov behavior are preserved
  # verbatim from the old 3.12 leg. The perf-budget suite is NOT
  # duplicated here — it runs serially on every matrix leg above.
  coverage-and-audit:
    name: Coverage & Audit (Python 3.12)
    runs-on: ubuntu-latest
    # Observed ~20 min for the old overloaded 3.12 leg; this job carries
    # the same coverage run minus the perf step. 30 gives headroom while
    # still bounding a true hang to minutes, not GitHub's 6-hour default.
    timeout-minutes: 30
    env:
      # Same glibc-arena cap as the test matrix (see comment there) —
      # this is the identical thread-heavy pytest run, plus coverage.
      MALLOC_ARENA_MAX: "2"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,local]" || pip install -e ".[dev]"

      # ── Tests + Coverage ────────────────────────────────────────
      - name: Run tests with coverage
        run: |
          python -m pytest \
            -n auto --dist loadscope \
            --ignore=tests/perf \
            --cov=fluid_build \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --junitxml=junit.xml \
            -q

      # ── Coverage Gates ──────────────────────────────────────────
      # NOTE: core gate is intentionally set to 70% right now. The original
      # bar was 80% but the project shipped from main with several test
      # classes failing under CI (TestRunExtra, copilot dispatch tests,
      # etc.). PR #5 marked those as @pytest.mark.xfail with documented
      # reasons rather than carrying inline --deselect flags in release.yml.
      # xfailed tests don't contribute coverage, so the realistic floor
      # dropped to ~74%. 70% gives a small buffer; restore to ≥80% in a
      # follow-up PR once the underlying TestRunExtra / dispatch issues
      # are fixed (tracked in the xfail reasons themselves).
      - name: "Coverage gate: core framework (≥70%)"
        run: |
          python -m coverage report --fail-under=70 \
            --omit="fluid_build/providers/*,fluid_build/cli/provider_action_executor.py"

      # V1 staged forge data-model pipeline gets its own tighter gate.
      # The new modules (``fluid_build/copilot/*`` + ``fluid_build/forge_datamodel/*``)
      # were built greenfield with comprehensive tests as they landed,
      # so a ≥80% floor is achievable from day one and pins the contract
      # that the v2 hardening cycle needs to maintain. The existing 70%
      # core gate above keeps stable for the broader codebase.
      #
      # Deliberately excluded from this V1 gate:
      # - ``copilot/agents/{scaffold,conceptual}_agent.py`` — deprecated
      #   in v1.0 (composition helpers only; coordinator routes through
      #   LogicalAgent / ModelerAgent directly).
      # - ``copilot/store/backends/postgres.py`` — exercised only when
      #   a Postgres DSN is supplied; non-CI CI default never reaches it.
      # - ``forge_datamodel/from_ddl/{snowflake_dumper,profiler}.py`` —
      #   require Snowflake creds / pyarrow extra respectively, both
      #   optional install paths.
      - name: "Coverage gate: V1 staged forge modules (≥80%)"
        run: |
          python -m coverage report --fail-under=80 \
            --include="fluid_build/copilot/*,fluid_build/forge_datamodel/*" \
            --omit="fluid_build/copilot/agents/scaffold_agent.py,fluid_build/copilot/agents/conceptual_agent.py,fluid_build/copilot/store/backends/postgres.py,fluid_build/forge_datamodel/from_ddl/snowflake_dumper.py,fluid_build/forge_datamodel/from_ddl/profiler.py"

      - name: "Coverage gate: local providers — no credentials (≥50%)"
        run: |
          python -m coverage report --fail-under=50 \
            --include="fluid_build/providers/__init__.py,fluid_build/providers/base.py,fluid_build/providers/common/*,fluid_build/providers/local/*,fluid_build/providers/catalogs/*,fluid_build/providers/odcs/*,fluid_build/providers/odps_standard/*,fluid_build/providers/quality_engine.py,fluid_build/providers/*_validation.py,fluid_build/providers/validation_*.py,fluid_build/cli/provider_action_executor.py"

      - name: "Coverage gate: cloud providers — needs credentials (≥20%)"
        run: |
          python -m coverage report --fail-under=20 \
            --include="fluid_build/providers/aws/*,fluid_build/providers/gcp/*,fluid_build/providers/snowflake/*,fluid_build/providers/opds/*,fluid_build/providers/datamesh_manager/*,fluid_build/providers/bigquery_validation.py"

      - name: "Coverage: total (informational)"
        run: python -m coverage report || true

      # ── Artifacts ───────────────────────────────────────────────
      # Distinct artifact name — the 3.12 matrix leg above still owns
      # `test-results-py3.12` (its plain-run junit.xml), and duplicate
      # artifact names fail under upload-artifact v4+.
      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: coverage-results-py3.12
          path: |
            junit.xml
            coverage.xml
          retention-days: 14

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: coverage.xml
          # Coverage upload is informational. If Codecov is down or
          # CODECOV_TOKEN isn't set in this repo's secrets, the upload
          # should NOT fail the build — the coverage *gates* are the
          # blocking signal.
          fail_ci_if_error: false

  # ── MCP SDK version drift ───────────────────────────────────────────────
  # Catches breaking changes in ``modelcontextprotocol/python-sdk`` at
  # PR-time instead of at user-install-time. Runs the MCP-touching test
  # files against the lower-bound pin from pyproject.toml + the latest 1.x
  # the SDK has released.
  #
  # If the SDK ships breaking changes in 2.x, this job will go red and we
  # can either pin a ceiling in pyproject.toml or do the 2.x port before
  # users hit it. Either is preferable to "the data team's pip install
  # picks up an incompatible mcp release tomorrow."
  mcp-sdk-drift:
    name: MCP SDK Drift (mcp ${{ matrix.mcp-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # "1.20" = lower-bound pin from pyproject.toml `mcp>=1.20`
        #          (see comment there for the FastMCP API features we need:
        #          deferred-annotation handling, ClientSession
        #          ``sampling_capabilities`` kwarg, etc.)
        # ""     = no version pin → latest 1.x (this is what users get today)
        mcp-version: ["1.20", ""]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install fluid-build + pinned MCP SDK
        run: |
          pip install --upgrade pip
          pip install -e ".[dev,local]" || pip install -e ".[dev]"
          if [ -n "${{ matrix.mcp-version }}" ]; then
            pip install --force-reinstall "mcp==${{ matrix.mcp-version }}"
          else
            pip install --upgrade mcp
          fi
          pip show mcp | head -3
      - name: Run MCP-touching tests
        run: |
          python -m pytest \
            tests/cli/test_scaffold_ide.py \
            tests/cli/test_mcp_sampling_provider.py \
            tests/cli/test_mcp_forge_run_live.py \
            tests/cli/test_mcp_sdk_client_e2e.py \
            -q

  build-check:
    name: Build Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel and sdist
        run: |
          pip install --upgrade pip build twine
          python -m build
      - name: Strict metadata check
        run: twine check --strict dist/*
      - name: Isolated wheel install and verify
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install dist/*.whl

          # Verify import resolves from site-packages, not checkout
          INSTALL_PATH=$(/tmp/smoke/bin/python -I -c "import fluid_build; print(fluid_build.__file__)")
          echo "Installed at: ${INSTALL_PATH}"
          if [[ "$INSTALL_PATH" != */site-packages/* ]]; then
            echo "::error::fluid_build resolved outside site-packages"
            exit 1
          fi

          # Verify critical runtime assets exist in installed package
          /tmp/smoke/bin/python -I -c "
          from pathlib import Path
          import fluid_build
          pkg = Path(fluid_build.__file__).parent
          assert (pkg / 'build-manifest.yaml').exists(), 'build-manifest.yaml missing'
          assert (pkg / 'templates' / 'hello-world' / 'contract.fluid.yaml').exists(), 'template missing'
          assert (pkg / 'schemas').is_dir(), 'schemas dir missing'
          print('All runtime assets verified')
          "

          # Verify CLI entry point works
          /tmp/smoke/bin/fluid --version

          # Functional scaffold check
          cd /tmp
          /tmp/smoke/bin/fluid init smoke-test --template hello-world
          test -f smoke-test/contract.fluid.yaml || { echo "::error::scaffold failed"; exit 1; }
          echo "Scaffold verified"

  # ──────────────────────────────────────────────────────────────
  # DuckDB end-to-end integration. Free, secret-less, runs on every PR
  # including from forks. Catches the kind of regressions mocked unit
  # tests miss: CLI dispatch, schema validation, contract-loader env
  # interpolation, plan-binding hash stability, the full 11-stage
  # pipeline orchestration.
  #
  # IMPORTANT: this job MUST NOT reference any cloud secrets. The whole
  # secret-scoping design depends on `ci.yml` being secret-free so fork
  # PRs can run it with full fidelity.
  # ──────────────────────────────────────────────────────────────
  duckdb-integration:
    name: DuckDB end-to-end (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # Surface every OS-specific failure on every run instead of
      # bailing on the first red. Cross-platform regressions are the
      # whole point of the matrix.
      fail-fast: false
      matrix:
        # ubuntu is the reference; macos catches pathlib + filesystem-case
        # regressions; windows catches CRLF, path-separator, and shell-
        # quoting regressions that contributors hit in the wild.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with local extras
        # `python -m pip` is more reliable on Windows than bare `pip`
        # (the bare command's PATH resolution differs between shells).
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,local]"
      - name: Run DuckDB end-to-end suite
        # Glob the test files so newly-added test_e2e_local_*.py and
        # test_local_live_*.py files are picked up automatically without
        # editing this workflow.
        #
        # No PYTHONUTF8 / PYTHONIOENCODING crutch: the fluid CLI now handles
        # a non-UTF-8 (Windows cp1252) locale itself — stdout/stderr are
        # reconfigured to UTF-8 at boot (#263) and every text file I/O passes
        # encoding="utf-8" (xsdOYJ6E). Running this job WITHOUT the env knobs
        # is the cross-platform proof that the CLI no longer needs them; a
        # static gate (tests/test_no_unencoded_text_io.py) keeps it that way.
        run: |
          python -m pytest -v -m "integration and not slow" tests/test_e2e_local.py tests/test_e2e_local_apply.py tests/test_e2e_local_negative.py tests/providers/test_local_live_happy_path.py
      - name: Cleanup local artifacts (defensive)
        if: always()
        run: python scripts/cleanup_local_test_artifacts.py

  # ──────────────────────────────────────────────────────────────
  # Stage 1 — keyless emulated provider integration. Free, secret-less,
  # runs on every PR including from forks. moto stands in for AWS,
  # fakesnow for Snowflake (both in-process — "light"). Heavy Docker
  # emulators (bigquery-emulator, LocalStack) are Stage 2, admin-gated in
  # integration-emulated-heavy.yml; real credentials are Stage 3 in
  # integration-live.yml.
  #
  # Selected by the `emulated` pytest marker — a new test_*.py marked
  # `emulated` is picked up here automatically, no workflow edit needed.
  #
  # IMPORTANT: like duckdb-integration, this job MUST NOT reference any
  # cloud secrets. The secret-scoping design depends on ci.yml being
  # secret-free so fork PRs can run it with full fidelity.
  # ──────────────────────────────────────────────────────────────
  emulated-integration:
    name: Emulated provider integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install with emulator extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,local,test-emulators]"
      - name: Run emulated provider integration suite
        run: python -m pytest -v -m emulated

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write  # upload Semgrep SARIF to GitHub code scanning
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project + pip-audit
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pip-audit
      - name: pip-audit dependency CVE scan
        # Fails the build on any known-vulnerable dependency. Keeps the
        # litellm / jinja2 / h11 / cryptography CVE floors honest over time.
        #
        # ORDER MATTERS — this audits the project's REAL resolved closure
        # BEFORE bandit/semgrep are installed. semgrep==1.163.0 pins
        # mcp==1.23.3, which caps pyjwt at 2.12.1 — below pyjwt's own CVE
        # floor (PYSEC-2026-175/177/178/179, fixed in 2.13.0). Installing the
        # SAST scanners into the same env therefore drags a known-vulnerable
        # pyjwt we don't even ship into the audited set and turns this gate
        # permanently red. The project alone resolves pyjwt>=2.13.0, so
        # auditing first keeps the gate honest. Do NOT fold the scanner
        # install back into the step above.
        run: pip-audit --desc
      - name: Install SAST scanners
        run: pip install bandit "semgrep==1.163.0"
      - name: Bandit security scan
        run: bandit -r fluid_build/ -c pyproject.toml --severity-level medium -q
      # Semgrep custom rules — forge-cli repo-specific invariants from
      # CLAUDE.md (deleted-module imports, SQL-safety helper bypass,
      # copilot workspace_root confinement). Generic SAST is CodeQL's job.
      - name: Semgrep custom-rule gate
        env:
          SEMGREP_SEND_METRICS: "off"
        run: semgrep scan --config .semgrep/fluid-rules.yml --error fluid_build/
      - name: Semgrep SARIF (advisory — code-scanning surface)
        if: always()
        env:
          SEMGREP_SEND_METRICS: "off"
        run: |
          semgrep scan --config .semgrep/fluid-rules.yml \
            --sarif --output semgrep.sarif fluid_build/ || true
      - name: Upload Semgrep SARIF
        # Skipped on fork PRs — their GITHUB_TOKEN cannot write
        # security-events. The gate step above still runs and still blocks.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  license-check:
    name: License Headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Check license headers
        run: python scripts/check_license_headers.py

  # Dependency review — blocks PRs that introduce known-vulnerable
  # dependencies. First-party GitHub action; requires the dependency
  # graph (Settings -> Code security). A license policy can be added
  # later via `deny-licenses` once the project agrees one.
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    # Only meaningful on PRs — the action diffs the dependency graph
    # between the base and head refs.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
