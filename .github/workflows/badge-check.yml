name: README Badge Check

# Verifies that the badges in the main README.md actually resolve to the
# expected state. Catches the class of bug where:
#   - the PyPI badge says "package or version not found" because the wheel
#     was renamed but the badge wasn't refreshed (camo cache);
#   - the CI badge stays "failing" because main is broken and nobody
#     noticed;
#   - shields.io changed format / response and badges silently break.
#
# Two triggers:
#   - On any PR / push that touches README.md or this workflow itself,
#     so a README badge change gets sanity-checked at PR time.
#   - Daily cron, so external state drift (PyPI re-indexes, CI breaks
#     after a flake) opens an issue automatically.

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/badge-check.yml"
  pull_request:
    branches: [main]
    paths:
      - "README.md"
      - ".github/workflows/badge-check.yml"
  schedule:
    # Daily 09:13 UTC — off-peak
    - cron: "13 9 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write   # the daily run opens an issue on failure

concurrency:
  group: badge-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pypi-badge:
    name: PyPI badge resolves to current version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify PyPI badge against the live package
        shell: bash
        run: |
          set -euo pipefail

          # Force a fresh fetch (cachebuster) so we don't trip on shields.io
          # caching the old fluid-forge name.
          BADGE_JSON=$(curl -sS --fail \
            "https://img.shields.io/pypi/v/data-product-forge.json?_=$(date +%s)")
          BADGE_VERSION=$(echo "$BADGE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin).get('value',''))")
          echo "Badge says: $BADGE_VERSION"

          # Cross-check against PyPI itself.
          PYPI_VERSION=$(curl -sS --fail \
            "https://pypi.org/pypi/data-product-forge/json" \
            | python3 -c "import sys,json; print('v' + json.load(sys.stdin)['info']['version'])")
          echo "PyPI says:  $PYPI_VERSION"

          if [ -z "$BADGE_VERSION" ] || [[ "$BADGE_VERSION" =~ (not\ found|invalid|error|unknown) ]]; then
            echo "::error::PyPI badge is broken: '$BADGE_VERSION'"
            exit 1
          fi

          if [ "$BADGE_VERSION" != "$PYPI_VERSION" ]; then
            echo "::warning::PyPI badge ($BADGE_VERSION) does not match PyPI latest ($PYPI_VERSION). " \
                          "shields.io may be cached; this self-resolves within ~24 h."
          fi

  ci-badge:
    name: CI badge is not 'failing' on main
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI badge state on main
        shell: bash
        run: |
          set -euo pipefail

          BADGE_SVG=$(curl -sS --fail \
            "https://github.com/Agenticstiger/forge-cli/actions/workflows/ci.yml/badge.svg?branch=main&_=$(date +%s)")

          # The svg embeds the state in the <title> tag, e.g. "CI - passing".
          STATE=$(echo "$BADGE_SVG" | grep -oE "<title>CI - [a-z]+</title>" | sed -E "s|<title>CI - ([a-z]+)</title>|\1|")
          echo "Main-branch CI state: $STATE"

          case "$STATE" in
            passing) echo "✅ CI badge is green." ;;
            failing) echo "::error::CI badge on main is FAILING. Fix main." ; exit 1 ;;
            "")      echo "::error::Could not read CI badge state from SVG." ; exit 1 ;;
            *)       echo "::warning::Unexpected CI badge state '$STATE' (treating as soft-fail)." ;;
          esac

  open-issue-on-cron-failure:
    name: Open tracking issue on scheduled-run failure
    needs: [pypi-badge, ci-badge]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = `Badge check: README badges broken (${new Date().toISOString().slice(0,10)})`;
            const body = [
              "Daily badge-check workflow detected a broken README badge.",
              "",
              `Run: ${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              "",
              "Inspect the failed job logs to see whether it's the PyPI badge or the CI badge.",
            ].join("\n");

            // Avoid duplicate issues if one is already open.
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "badge-check",
              per_page: 5,
            });
            if (existing.data.length > 0) {
              core.notice(`Open badge-check issue already exists: #${existing.data[0].number}; not opening another.`);
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["badge-check", "ci"],
            });
