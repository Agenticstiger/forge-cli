# Stage 2 — heavy emulated integration tests.
#
# Docker-based emulators that are too heavy for the keyless community lane
# (ci.yml `emulated-integration`, Stage 1):
#   • GCP — goccy/bigquery-emulator + fsouza/fake-gcs-server + gcloud
#     pubsub, via tests/iac/_gcp_emulator/docker-compose.yml. Keyless.
#   • AWS — LocalStack (S3 + Glue, and the Spark lane: Glue 5, EMR Serverless
#     and EMR on EC2 runs with MSK). Needs LOCALSTACK_AUTH_TOKEN; Glue is a
#     LocalStack Pro feature (Ultimate tier and above).
#   • Lakekeeper + Kafka Connect — forge-derived Iceberg sink configs on a
#     real worker against a real Lakekeeper REST catalog. Keyless, in its
#     own job (`lakekeeper-integration`).
#   • Confluent schema registry: `fluid generate iac --provider confluent`
#     applied by OpenTofu to cp-schema-registry on a KRaft Kafka. Keyless,
#     in its own job (`confluent-schema-registry`).
#
# WHY THIS LANE RUNS NIGHTLY, NOT ON A LABEL AND NOT PER MERGE
# ------------------------------------------------------------
# It was label-gated + required-reviewer gated because emulated runs were
# assumed to cost something. They do not: the repo is public, so standard
# runners are free, and LocalStack removed its CI/CD build limits in March
# 2026, so every paid plan runs unlimited in CI.
#
# The gate was not free, though. integration-label-guard.yml strips the
# label on every push, so the vouch had to be re-applied and re-approved
# per push; the one run that ever reached the queue sat unapproved for
# twelve days and was cancelled. The lane proved nothing between
# 2026-07-13 and now.
#
# Nightly rather than per-merge, deliberately. iac-tests.yml ALREADY runs
# this same GCP emulator stack on every push to main (2-3 min, green), so
# per-merge here would re-run covered ground; the only half it would add
# is LocalStack. Against that: every run writes an `integration-emulated`
# deployment record, and at ~19 merges a week that buries the environment
# page this lane is meant to keep readable. Nightly puts ~3 merges between
# runs — still cheap to bisect — for one record a day.
#
# Weekly would be too slow: ~19 merges between runs is not an attributable
# failure. If that trade ever changes, this is a one-line edit to the cron.
#
# The `pull_request` path keeps the `ci:integration-emulated` label as its
# maintainer vouch, re-vouched per push by integration-label-guard.yml;
# that is the control that actually gates un-reviewed PR code, and
# actionlint.yml enforces it. Use the label to prove a change here before
# it merges, rather than waiting for the nightly.
#
# `integration-emulated` remains a SEPARATE environment from
# `integration-live` — it holds only LOCALSTACK_AUTH_TOKEN, so this lane
# can never reach the real cloud or LLM credentials.
#
# ANTI-SILENT-GREEN
# -----------------
# Every emulator test skips itself when its emulator is unreachable, which
# is what keeps the suite laptop- and fork-runnable. The cost is a lane
# that exits 0 having skipped what it advertises: this job selected 54
# tests by marker, provisioned an emulator for 3, and reported success for
# fourteen months. `scripts/ci/assert_lane_coverage.py` now fails the job
# unless each area it provisioned actually contributed a passing test.
name: Integration (emulated heavy)

on:
  pull_request:
    types: [labeled, synchronize]
  schedule:
    # 05:00 UTC — clear of iac-tests (03:00) and integration.yml (04:00).
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-emulated-heavy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  emulated-heavy:
    name: Heavy emulated integration (GCP emulators + LocalStack)
    runs-on: ubuntu-latest
    # 45, not 25, since the Spark lane joined: about 6 min on a warm laptop, plus the Glue 5
    # image pull on a cold runner (the pre-pull step below times it).
    timeout-minutes: 45
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:integration-emulated')
    environment: integration-emulated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      # Every test in tests/iac/test_iac_gcp_emulator_e2e.py is a `*_plan_clean`
      # test: it shells out to `tofu init` + `tofu plan` to prove the emitted
      # .tf.json is well-formed for the real google provider. Without the binary
      # all ten skip themselves, and because they skip rather than fail, pytest
      # still exits 0 — which is exactly how this lane went green while proving
      # nothing. Same action SHA as iac-tests.yml, and the first tofu version
      # (and checksum) of its matrix, deliberately: two lanes disagreeing about
      # the provider version would be worse than neither running.
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2.0.2
        with:
          tofu_version: 1.12.12
          checksums: 723df4d3044ca2e1fd8469d715a24869889c53e7f45458b1f2ea2e40e344789d  # 1.12.12 linux_amd64 zip  # pragma: allowlist secret

      # ``local`` brings DuckDB: the embedded-SQL chain on the bigquery-emulator
      # runs its SQL there. Without it that test skips, and the lane-coverage
      # assert below fails the job.
      - name: Install with heavy-emulator extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test-emulators-heavy,local]"

      # Skip-clean: a secret cannot gate a job-level `if:`. With no token
      # the LocalStack steps skip and the GCP half still runs — EXCEPT on
      # the nightly, where a missing token is the failure being looked
      # for. A token that silently expires is how the sibling lane in
      # command_center stayed dead across four commits.
      - name: Check for the LocalStack auth token
        id: gate
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          if [ -n "$LOCALSTACK_AUTH_TOKEN" ]; then
            echo "localstack=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::error::LOCALSTACK_AUTH_TOKEN is not set on the"
            echo "::error::integration-emulated environment, so the AWS half"
            echo "::error::of this lane cannot run. Set it with:"
            echo "::error::  gh secret set LOCALSTACK_AUTH_TOKEN -R ${{ github.repository }} --env integration-emulated"
            exit 1
          else
            echo "localstack=false" >> "$GITHUB_OUTPUT"
            echo "::notice::LOCALSTACK_AUTH_TOKEN not configured — running the GCP half only; LocalStack tests will skip."
          fi

      - name: Start LocalStack
        if: steps.gate.outputs.localstack == 'true'
        env:
          LOCALSTACK_AUTH_TOKEN: ${{ secrets.LOCALSTACK_AUTH_TOKEN }}
        run: |
          # Fully pinned, per the repo's container-image convention. `stable`
          # moved under this lane while it was dormant; an emulator that
          # upgrades itself is not a fixed baseline to test against.
          # The docker socket is not optional once the IaC round-trips run
          # here: LocalStack's Lambda runtime spawns a container per
          # execution, and without the bind-mount `tofu apply` fails with
          # "Error while creating lambda: Docker not available". Documented in
          # docs/upstream-issues/localstack-lambda-docker-in-docker.md;
          # verified locally 2026-09-14 that the mount is what fixes it.
          docker run -d --name fluid-localstack -p 4566:4566 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e LOCALSTACK_AUTH_TOKEN="$LOCALSTACK_AUTH_TOKEN" \
            localstack/localstack:2026.08.2
          for i in $(seq 1 60); do
            if curl -sf http://localhost:4566/_localstack/health >/dev/null 2>&1; then
              echo "LocalStack ready after ~$((i * 2))s"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:4566/_localstack/health || {
            echo "::error::LocalStack did not become healthy within 120s."
            docker logs fluid-localstack --tail=50 || true
            exit 1
          }

      # The Spark lane (tests/spark/test_spark_localstack.py) runs Glue 5 jobs, which
      # LocalStack runs in the real aws-glue-libs image through the mounted docker socket.
      # Pulling it here, timed and with the disk it leaves, keeps a slow or failed pull out
      # of the test step's budget and makes it attributable. Same tag the lane measured on.
      - name: Pre-pull the Glue 5 image for the Spark lane
        if: steps.gate.outputs.localstack == 'true'
        run: |
          start=$(date +%s)
          docker pull amazon/aws-glue-libs:5.0.8
          echo "Glue 5 image pulled in $(( $(date +%s) - start ))s"
          df -h / | tail -1

      # Keyless — always. `-m emulated_heavy` selects the GCP emulator
      # tiers, so the lane that names them has to provision them; without
      # this they skipped silently inside a job called "bigquery-emulator".
      - name: Start GCP emulators
        run: |
          docker compose -f tests/iac/_gcp_emulator/docker-compose.yml up -d
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9050/discovery/v1/apis/bigquery/v2/rest >/dev/null 2>&1; then
              echo "bigquery-emulator ready after ~$((i * 2))s"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:9050/discovery/v1/apis/bigquery/v2/rest >/dev/null || {
            echo "::error::bigquery-emulator did not answer within 60s."
            docker compose -f tests/iac/_gcp_emulator/docker-compose.yml logs --tail=50 || true
            exit 1
          }

      - name: Run heavy emulated integration tests
        timeout-minutes: 35
        env:
          FLUID_LOCALSTACK_ENDPOINT: http://localhost:4566
          # The Spark lane's opt-in: Glue 5, EMR Serverless and EMR on EC2 runs started by
          # fluid apply's build phase. It skips itself when LocalStack is not reachable.
          FLUID_SPARK_LOCALSTACK: "1"
          # The IaC round-trips are triple-gated: `tofu` on PATH (installed
          # above), LocalStack reachable, and this opt-in. AWS_* are
          # LocalStack's conventional dummy credentials — NOT the emulator's
          # own bypass; the auth token is what unlocks Glue and Lake Formation.
          FLUID_IAC_LIVE_LOCALSTACK: "1"
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test  # pragma: allowlist secret
          AWS_DEFAULT_REGION: us-east-1
          FLUID_IAC_LIVE_GCP_EMULATOR: "1"
          PUBSUB_EMULATOR_HOST: "localhost:8085"
          FLUID_GCP_BIGQUERY_EMULATOR: "http://localhost:9050"
          FLUID_GCP_STORAGE_EMULATOR: "http://localhost:4443"
        run: python -m pytest -v -m emulated_heavy --junitxml=emulated-heavy.xml

      # pytest exits 0 on an all-skipped run. This does not.
      - name: Assert the lane actually exercised its emulators
        if: always()
        run: |
          requirements=(
            --require "GCP emulator e2e=tests/iac/test_iac_gcp_emulator_e2e.py"
            --require "GCP cross-project=tests/iac/test_iac_cross_project_gcp_emulator.py"
            --require "BigQuery happy path=tests/providers/test_bigquery_emulated_happy_path.py"
            --require "BigQuery embedded-SQL chain=tests/providers/test_bigquery_emulated_embedded_sql_chain.py"
          )
          if [ "${{ steps.gate.outputs.localstack }}" = "true" ]; then
            requirements+=(--require "AWS LocalStack=tests/providers/test_aws_localstack_happy_path.py")
            requirements+=(--require "AWS IaC round-trips=tests/iac/test_iac_aws_localstack_e2e.py")
            requirements+=(--require "Spark lane on LocalStack=tests/spark/test_spark_localstack.py")
          fi
          python scripts/ci/assert_lane_coverage.py emulated-heavy.xml "${requirements[@]}"

      # LocalStack runs the Spark lane's EMR jobs inside its own container, so their Spark
      # output is only in its log. Always, not on failure: the EMR lane tests are an xfail
      # while their intermittent failure is open (Trello xZtxKx2N), so the step passes either way.
      # The lane deletes its S3 buckets on teardown, so there are no run logs left to list.
      - name: LocalStack log (EMR and Spark output)
        if: always() && steps.gate.outputs.localstack == 'true'
        run: |
          echo "::group::LocalStack log, EMR and Spark lines (last 300)"
          docker logs fluid-localstack 2>&1 | grep -iE "emr|spark|jobrun|job run|step" | tail -300 || true
          echo "::endgroup::"
          echo "::group::LocalStack log (last 400 lines)"
          docker logs fluid-localstack --tail 400 2>&1 || true
          echo "::endgroup::"

      - name: Stop GCP emulators
        if: always()
        run: docker compose -f tests/iac/_gcp_emulator/docker-compose.yml down || true

      - name: Stop LocalStack
        if: always() && steps.gate.outputs.localstack == 'true'
        run: docker rm -f fluid-localstack || true

  # ────────────────────────────────────────────────────────────────────
  # DataHub Quickstart lane — exercises the canonical DataHubRegistrar
  # against a real DataHub OSS GMS booted via the project's Docker
  # Quickstart.
  #
  # Why a separate job (not folded into emulated-heavy above):
  #   - DataHub Quickstart is its own multi-container stack (GMS,
  #     frontend, MySQL, Kafka, Elasticsearch) — running it alongside
  #     LocalStack on one runner peaks at ~12 GB RAM, which exceeds
  #     `ubuntu-latest`'s 7 GB limit.
  #   - Quickstart pull + boot is ~3-4 min on a cold runner; isolating
  #     it lets the GCP + LocalStack job finish independently and
  #     keeps the failure surface attributable.
  #
  # Secret-less. The `datahub` CLI exposes a self-contained Quickstart
  # via `docker compose` against pinned tags; no DataHub Cloud token
  # is involved. Tests run via the `tests/integration/test_catalog_datahub_live.py`
  # + `tests/integration/test_catalog_datahub_lineage_e2e.py` matrix
  # (gated on `DATAHUB_GMS_URL` being set — skip-clean if the boot
  # times out).
  datahub-integration:
    name: DataHub Quickstart integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:integration-emulated')
    environment: integration-emulated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install fluid-build + acryl-datahub CLI
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          # acryl-datahub provides the `datahub docker quickstart` helper
          # which stands up the GMS + frontend + storage + Kafka stack.
          # Pin to a specific minor — the docker-compose shape evolves
          # version to version and we want repeatable boots.
          python -m pip install "acryl-datahub==1.5.0.6"

      - name: Start DataHub Quickstart
        id: quickstart
        env:
          # Quickstart resolves the version tag from the CLI itself; pin
          # via env so we control which docker images get pulled. Matches
          # the lab's local Quickstart pin so behaviour is identical.
          DATAHUB_VERSION: v1.5.0.6
        run: |
          # `--quickstart-compose-file` defaults to the embedded
          # docker-compose-without-neo4j.yml, which has the smaller
          # footprint (no Neo4j) — sufficient for our catalog tests.
          datahub docker quickstart --version "$DATAHUB_VERSION" --no-pull-images || true
          # Wait for GMS REST on :8080 — that's the endpoint
          # ``safe_httpx_client`` connects to via DATAHUB_GMS_URL.
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8080/config >/dev/null 2>&1; then
              echo "DataHub GMS ready after ~$((i * 4))s"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 4
          done
          if ! curl -sf http://localhost:8080/config >/dev/null 2>&1; then
            echo "::warning::DataHub GMS did not come up in 6 minutes — skipping tests"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run DataHub integration tests
        if: steps.quickstart.outputs.ready == 'true'
        timeout-minutes: 15
        env:
          DATAHUB_GMS_URL: http://localhost:8080
        run: |
          python -m pytest -v \
            tests/integration/test_catalog_datahub_live.py \
            tests/integration/test_catalog_datahub_lineage_e2e.py

      - name: Collect DataHub logs on failure
        if: failure()
        run: |
          datahub docker check || true
          docker compose -p datahub logs --tail=200 || true

      - name: Tear down DataHub Quickstart
        if: always()
        run: |
          datahub docker nuke --keep-data 2>&1 | tail -5 || true

  # ────────────────────────────────────────────────────────────────────
  # Lakekeeper + Kafka Connect lane — forge's derived Iceberg sink
  # configs on a real worker.
  #
  # What tests/integration/test_lakekeeper_kafka_connect_live.py proves:
  #   - a `location.catalog: lakekeeper` expose, derived through forge's
  #     real code, streams records into a real Lakekeeper REST catalog,
  #     which vends STS credentials for Silo (S3 + STS);
  #   - the same worker refuses a sink carrying both
  #     `iceberg.catalog.type` and `iceberg.catalog.catalog-impl`, the
  #     startup crash every Glue sink hit before the deriver emitted
  #     impl XOR type;
  #   - forge's derived Glue config gets past that refusal.
  #
  # What tests/integration/test_lakekeeper_oauth_live.py proves, on the
  # same stack plus Keycloak, with Lakekeeper's OpenID authentication on:
  #   - a derived sink with `sink.catalogAuth: {type: oauth2}` streams
  #     records into the auth-required Lakekeeper, the client credential
  #     reaching the worker only as an environment variable;
  #   - the connector config Kafka Connect stores holds
  #     `env:LK_CREDENTIAL`, never the secret;
  #   - the same config naming a variable the worker lacks fails its task
  #     on Lakekeeper's 401 and writes nothing;
  #   - Lakekeeper refuses a request with no token, or with a token
  #     minted for another audience.
  #
  # Keyless: the stacks are self-contained (Postgres, Lakekeeper, Silo,
  # KRaft Kafka, cp-kafka-connect, Keycloak, every image pinned by
  # digest), so there is no `environment:` and no deployment record. The
  # Keycloak client secret is generated by the test per run; nothing in
  # this job is a secret. It still gates on the same label as its
  # siblings so un-vouched PR code gets no runner.
  #
  # The two modules run one after the other, each on a stack of its own
  # (module-scoped fixtures), under the fixed project names below.
  #
  # The test downloads the Apache Iceberg sink ZIP itself and verifies
  # its sha1. The unzipped plugin is cached here by version + sha1; if
  # the test's pin moves and this key does not, the stale cache is
  # simply re-downloaded over (its .sha1 marker no longer matches).
  lakekeeper-integration:
    name: Lakekeeper + Kafka Connect integration
    runs-on: ubuntu-latest
    timeout-minutes: 55
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:integration-emulated')
    permissions:
      contents: read
    env:
      ICEBERG_SINK_VERSION: "1.9.2"
      # The ZIP's published sha1, not a credential.
      ICEBERG_SINK_SHA1: 52dab2ff2b9659008deec803d1c1e92813c5ffa7  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      # The test imports only forge's pure derivation modules and drives the
      # stack through `docker compose` and urllib: the base install plus the
      # pytest plugin pyproject.toml configures is all it needs.
      - name: Install fluid-build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "pytest>=7.4" "pytest-timeout>=2.3"

      - name: Restore the Iceberg sink plugin
        id: plugin-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/iceberg-kafka-connect
          key: iceberg-kafka-connect-${{ env.ICEBERG_SINK_VERSION }}-${{ env.ICEBERG_SINK_SHA1 }}

      # Two stacks, one after the other: the OAuth2 module adds a second
      # bring-up (Keycloak included) and its own warm-up commit rounds.
      - name: Run the Lakekeeper + Kafka Connect live tests
        timeout-minutes: 45
        env:
          FLUID_TEST_LAKEKEEPER: "1"
          FLUID_LK_PLUGIN_CACHE: ${{ runner.temp }}/iceberg-kafka-connect
          # Fixed project names (one per module) so the steps below can
          # collect logs from, and tear down, a stack the test could not clean
          # up (a timeout kill).
          FLUID_LK_PROJECT: fluid-lk-ci
          FLUID_LK_AUTH_PROJECT: fluid-lk-auth-ci
          FLUID_LK_LOG_DIR: ${{ runner.temp }}/lakekeeper-logs
        run: |
          python -m pytest -v -m emulated_heavy \
            tests/integration/test_lakekeeper_kafka_connect_live.py \
            tests/integration/test_lakekeeper_oauth_live.py \
            --junitxml=lakekeeper.xml

      # pytest exits 0 on an all-skipped run. This does not.
      - name: Assert the lane actually exercised Lakekeeper
        if: always()
        run: |
          python scripts/ci/assert_lane_coverage.py lakekeeper.xml \
            --require "Lakekeeper + Kafka Connect=tests/integration/test_lakekeeper_kafka_connect_live.py" \
            --require "Lakekeeper OAuth2 (Keycloak) catalogAuth=tests/integration/test_lakekeeper_oauth_live.py"

      # Saved whether or not the tests passed: the download does not depend on
      # them. Only a verified install is saved; the test's one-shot writes the
      # .sha1 marker last, after `sha1sum -c` passed.
      - name: Check the plugin cache is complete
        id: plugin-ready
        if: always() && steps.plugin-cache.outputs.cache-hit != 'true'
        env:
          CACHE_DIR: ${{ runner.temp }}/iceberg-kafka-connect
        run: |
          if [ "$(cat "$CACHE_DIR/.sha1" 2>/dev/null)" = "$ICEBERG_SINK_SHA1" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Save the Iceberg sink plugin
        if: always() && steps.plugin-ready.outputs.ready == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ runner.temp }}/iceberg-kafka-connect
          key: ${{ steps.plugin-cache.outputs.cache-primary-key }}

      # The test writes compose logs to FLUID_LK_LOG_DIR when it fails; this
      # catches the case it could not, a run killed before its teardown.
      - name: Collect logs from a stack left behind
        if: failure()
        env:
          LOG_DIR: ${{ runner.temp }}/lakekeeper-logs
        run: |
          mkdir -p "$LOG_DIR"
          for project in fluid-lk-ci fluid-lk-auth-ci; do
            docker compose -p "$project" logs --no-color --tail=500 \
              > "$LOG_DIR/$project-left-behind.log" 2>&1 || true
          done

      - name: Upload JUnit + compose logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: lakekeeper-integration-logs
          path: |
            lakekeeper.xml
            ${{ runner.temp }}/lakekeeper-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Tear down a stack left behind
        if: always()
        run: |
          for project in fluid-lk-ci fluid-lk-auth-ci; do
            docker compose -p "$project" down -v --remove-orphans || true
          done

  # ────────────────────────────────────────────────────────────────────
  # Confluent schema registry lane: forge's registry writes on a real
  # registry.
  #
  # What tests/integration/test_confluent_schema_registry_live.py proves:
  #   - `fluid generate iac --provider confluent` for an Avro and a
  #     Protobuf produced subject, applied by OpenTofu with the
  #     confluentinc/confluent provider the module requires (`~> 2.0`, so
  #     the newest 2.x), registers the schemas forge generated, with the
  #     schema type and BACKWARD_TRANSITIVE it set;
  #   - a second plan finds nothing to change;
  #   - a new nullable column registers as version 2;
  #   - destroy deletes the versions the module manages. The provider
  #     deletes only the version in its state, so an evolved subject keeps
  #     its earlier versions; the test removes those itself.
  # Rules (`rules: true`) need the rule executor of Confluent Cloud or
  # Platform Enterprise, which the community registry lacks: their
  # attributes are proven by `tofu validate` in iac-tests.yml.
  #
  # Keyless and self-contained, like `lakekeeper-integration`: a single-node
  # KRaft Kafka (that job's image and settings) and cp-schema-registry (the
  # Confluent Platform release of its cp-kafka-connect), each pinned by
  # digest, on a docker network this job creates and removes. Nothing here
  # is a secret, so there is no `environment:` and no deployment record. It
  # still gates on the same label as its siblings so un-vouched PR code gets
  # no runner. The registry has no authentication; the test passes the
  # provider placeholder credentials.
  confluent-schema-registry:
    name: Confluent schema registry integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'ci:integration-emulated')
    permissions:
      contents: read
    env:
      # Names unique to this run, so the cleanup removes only what it created.
      SR_NETWORK: fluid-sr-ci-${{ github.run_id }}-${{ github.run_attempt }}
      SR_KAFKA: fluid-sr-ci-kafka-${{ github.run_id }}-${{ github.run_attempt }}
      SR_REGISTRY: fluid-sr-ci-registry-${{ github.run_id }}-${{ github.run_attempt }}
      KAFKA_IMAGE: apache/kafka:3.9.1@sha256:4ceccc577f03f51f6af8dbfda55194d0d892f4fa7913ffbded567ce3895622ed
      REGISTRY_IMAGE: confluentinc/cp-schema-registry:7.9.10@sha256:ae63c314e3f78f78d5bdce8c64c0f98ea1dc4d358ef52de2fdae56cda7e82ec0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      # Same action SHA, version and checksum as the emulated-heavy job above
      # and iac-tests.yml's first matrix entry: the provider is fetched by the
      # same tofu everywhere.
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4  # v2.0.2
        with:
          tofu_version: 1.12.12
          checksums: 723df4d3044ca2e1fd8469d715a24869889c53e7f45458b1f2ea2e40e344789d  # 1.12.12 linux_amd64 zip  # pragma: allowlist secret

      - name: Install fluid-build
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,local]"

      - name: Start Kafka and the schema registry
        run: |
          docker network create "$SR_NETWORK"
          # Single-node KRaft, one process as broker and controller: the
          # settings of tests/integration/test_lakekeeper_kafka_connect_live.py.
          # The registry keeps its subjects in this broker's _schemas topic.
          docker run -d --name "$SR_KAFKA" --network "$SR_NETWORK" --network-alias kafka \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:19092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:19092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0 \
            -e KAFKA_HEAP_OPTS=-Xmx512m \
            "$KAFKA_IMAGE"
          # The registry gives up if Kafka is not there when it starts.
          for i in $(seq 1 60); do
            if docker exec "$SR_KAFKA" /opt/kafka/bin/kafka-broker-api-versions.sh \
                --bootstrap-server localhost:19092 >/dev/null 2>&1; then
              echo "Kafka ready after ~$((i * 2))s"; break
            fi
            sleep 2
          done
          docker exec "$SR_KAFKA" /opt/kafka/bin/kafka-broker-api-versions.sh \
            --bootstrap-server localhost:19092 >/dev/null 2>&1 || {
            echo "::error::Kafka did not answer within 120s."
            docker logs "$SR_KAFKA" --tail=50 || true
            exit 1
          }
          docker run -d --name "$SR_REGISTRY" --network "$SR_NETWORK" -p 127.0.0.1:8081:8081 \
            -e SCHEMA_REGISTRY_HOST_NAME=schema-registry \
            -e SCHEMA_REGISTRY_LISTENERS=http://0.0.0.0:8081 \
            -e SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS=PLAINTEXT://kafka:19092 \
            -e SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR=1 \
            "$REGISTRY_IMAGE"
          for i in $(seq 1 90); do
            if curl -sf http://localhost:8081/subjects >/dev/null 2>&1; then
              echo "Schema registry ready after ~$((i * 2))s"; break
            fi
            # A registry that exited will not answer: stop waiting.
            if [ "$(docker inspect -f '{{.State.Running}}' "$SR_REGISTRY")" != "true" ]; then
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8081/subjects >/dev/null || {
            echo "::error::The schema registry did not answer within 180s."
            docker logs "$SR_KAFKA" --tail=50 || true
            docker logs "$SR_REGISTRY" --tail=50 || true
            exit 1
          }

      - name: Run the Confluent schema registry live test
        timeout-minutes: 15
        env:
          FLUID_SR_LIVE_ENDPOINT: http://localhost:8081
        run: python -m pytest -v -m emulated_heavy tests/integration/test_confluent_schema_registry_live.py --junitxml=confluent-sr.xml

      # pytest exits 0 on an all-skipped run. This does not.
      - name: Assert the lane actually exercised the registry
        if: always()
        run: |
          python scripts/ci/assert_lane_coverage.py confluent-sr.xml \
            --require "Confluent schema registry=tests/integration/test_confluent_schema_registry_live.py"

      - name: Collect container logs on failure
        if: failure()
        run: |
          docker logs "$SR_REGISTRY" --tail=100 || true
          docker logs "$SR_KAFKA" --tail=100 || true

      # Only what this run created: its two containers and its network.
      - name: Remove the containers and network
        if: always()
        run: |
          docker rm -f "$SR_REGISTRY" "$SR_KAFKA" || true
          docker network rm "$SR_NETWORK" || true
