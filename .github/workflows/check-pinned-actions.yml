# Check Pinned Actions — detect stale SHA pins in generated CI templates
#
# Runs monthly and on manual dispatch. Opens a GitHub issue when
# PINNED_ACTIONS in pipeline_templates.py falls behind upstream releases.

name: Check Pinned Actions

on:
  schedule:
    - cron: "23 9 1 * *"  # 1st of each month at 09:23 UTC
  workflow_dispatch:

permissions: {}

jobs:
  check-pins:
    name: Verify action SHAs are current
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.12"

      - name: Check pinned action SHAs
        id: check
        run: |
          python scripts/check_pinned_actions.py --strict > report.txt 2>&1 || true
          {
            echo "report<<REPORT_EOF"
            cat report.txt
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"
          python scripts/check_pinned_actions.py --strict
        continue-on-error: true

      - name: Open issue if stale
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Report passed via env so the issue-body shell strings below stay
          # fully indented inside this YAML block scalar (no column-0 heredoc).
          PIN_REPORT: ${{ steps.check.outputs.report }}
          PIN_TRIGGER: ${{ github.event.schedule && 'scheduled' || 'manual' }}
          PIN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Check if an open issue already exists
          EXISTING=$(gh issue list --label "dependencies" --state open --search "Stale pinned GitHub Actions" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Issue #${EXISTING} already open — adding comment"
            # Backticks in the strings below are literal Markdown, not command
            # substitution — the single quotes are intentional.
            # shellcheck disable=SC2016
            COMMENT_BODY=$(printf '%s\n' \
              "Monthly check found stale pins (${PIN_TRIGGER}):" \
              '' \
              '```' \
              "${PIN_REPORT}" \
              '```' \
              '' \
              'Run `python scripts/check_pinned_actions.py` locally for details.')
            gh issue comment "$EXISTING" --body "$COMMENT_BODY"
          else
            # Backticks in the strings below are literal Markdown, not command
            # substitution — the single quotes are intentional.
            # shellcheck disable=SC2016
            ISSUE_BODY=$(printf '%s\n' \
              'The monthly SHA pin check found outdated actions in `PINNED_ACTIONS`.' \
              '' \
              '```' \
              "${PIN_REPORT}" \
              '```' \
              '' \
              '### How to fix' \
              '1. Run `python scripts/check_pinned_actions.py` to see which pins are stale' \
              '2. Update the SHAs in `fluid_build/forge/core/pipeline_systems/_base.py`' \
              '3. Verify with `python scripts/check_pinned_actions.py --strict`' \
              '' \
              "This issue was created automatically by the [check-pinned-actions](${PIN_RUN_URL}) workflow.")
            gh issue create \
              --title "Stale pinned GitHub Actions in generated CI templates" \
              --label "dependencies" \
              --body "$ISSUE_BODY"
          fi
