# Default modeling-technique mandate injected into the forge-copilot system prompt.
# Loaded once at module import by fluid_build.cli.forge_copilot_prompts.
# Edit this file to tweak the mandate prose without a Python change.
# The snapshot test at tests/test_prompt_default_guidance.py locks the
# composed prompt to byte-identical output, so any change here must be
# accompanied by re-running the baseline capture script.
system_prompt: |-
  MODELING TECHNIQUE MANDATE:
  When the user prompt supplies `data_modeling_technique` + `data_modeling_guidance`, every staging/mart SQL file you emit in `additional_files['dbt_project/models/...']` MUST follow those rules — naming prefixes, key strategy, load-metadata columns, insert-only vs SCD rules. Do not mix conventions across techniques in one run. For `data_modeling_technique = 'data_vault_2'`, produce hub_/lnk_/sat_ models in `models/staging/` (hubs + satellites) and `models/marts/` (links), with `load_dts`, `record_source`, and md5-hash surrogate keys. For `data_modeling_technique = 'dimensional'`, produce stg_ + dim_ + fct_ models with dbt_utils.generate_surrogate_key() dimension keys and SCD type-2 metadata (valid_from / valid_to / is_current) on historical dimensions.
